/* ═══════════════════════════════════════════════════════════════════
   DASHBOARD — the new landing screen. Every number here is pulled from
   data the app already tracks and computes elsewhere (stock status math,
   COGS spend, breakage, history) — nothing new is invented. Deliberately
   does NOT show a cross-supplier "low stock" figure: state.onHand is read
   for display elsewhere but is never actually written by anything in this
   app, so a dashboard built on it would always read empty for four of the
   five suppliers — quietly wrong, not just incomplete.
   ═══════════════════════════════════════════════════════════════════ */
function quickAddExpense(){ goToReportsSubTab('cog'); openExpenseDetail(null); }

function dashboardView(){
  const now = new Date();
  const mk = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');

  // Trimark: real, live signal — items already counted this period that
  // are below par. Uses the exact same math as everywhere else (case
  // rounding included), so it never disagrees with Inventory or Order.
  const triItems = state.catalog.TRIMARK.items;
  const triCounted = triItems.filter(i=>{ const t=state.trimark[i.id]||{}; return t.count!=null && t.count!==''; });
  const triNeeded = triItems.map(it=>{
    const t = state.trimark[it.id]||{};
    if(t.count==null || t.count==='') return null;
    const r = trimarkRow(t.begin, t.add, t.count, it.par, it.unitCost);
    return r.order>0 ? {name:it.name, order:unitsToCases(r.order, it.caseQty), caseQty:it.caseQty} : null;
  }).filter(Boolean);

  // Draft orders sitting unsent on the Order tab, per supplier — real data
  // (state.orderQty), not a guess at what "should" be ordered.
  const draftsBySupplier = SUP_NAMES.map(sn=>{
    const items = state.catalog[sn].items;
    const n = items.reduce((c,it)=> c + ((+state.orderQty[it.id]||0)>0?1:0), 0);
    return {sn, n};
  }).filter(d=>d.n>0);

  const cog = cogSpendFromOrders(state.history, state.catalog, mk);
  const otherSpend = expenseTotalForMonth(mk);
  const monthSpend = cog.total + otherSpend;

  const breakageData = buildReport(state.history, {
    start: mk+'-01', end: isoDate(now), suppliers:'all', types:'inventory', activeOnly:false, search:''
  });
  const breakageTotal = breakageData.rows.reduce((s,r)=> s+(r.breakageValue||0), 0);

  const recent = state.history.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,5);

  return `
    <div class="btn-row" style="flex-wrap:wrap">
      <button class="btn" style="flex:1 1 45%" onclick="setTab('inventory')">📦 Start inventory</button>
      <button class="btn ghost" style="flex:1 1 45%" onclick="setTab('order')">📋 Place an order</button>
      <button class="btn ghost" style="flex:1 1 45%" onclick="quickAddExpense()">🧾 Add expense</button>
      <button class="btn ghost" style="flex:1 1 45%" onclick="goToReportsSubTab('price')">🏷️ Update prices</button>
    </div>

    <div class="hist-card" style="cursor:pointer" onclick="setTab('inventory')">
      <label class="fl">Inventory this period</label>
      <div style="font-size:24px;font-weight:800">${triCounted.length}/${triItems.length} <span style="font-size:13px;font-weight:400;color:var(--dim)">counted</span></div>
      ${triNeeded.length ? `<div class="sched" style="color:var(--crit);padding-top:4px">⚠ ${triNeeded.length} item${triNeeded.length!==1?'s':''} below par so far</div>`
        : (triCounted.length ? `<div class="sched" style="padding-top:4px">Nothing below par yet.</div>` : '')}
    </div>

    ${draftsBySupplier.length ? `<div class="hist-card">
      <label class="fl">Draft orders in progress</label>
      ${draftsBySupplier.map(d=>`<div style="display:flex;justify-content:space-between;padding:6px 0;cursor:pointer"
          onclick="setSupp('${d.sn}');setTab('order')">
        <span>${esc(d.sn)}</span><span style="font-weight:700">${d.n} item${d.n!==1?'s':''} not sent</span>
      </div>`).join('')}
    </div>` : ''}

    <div style="display:flex;gap:10px">
      <div class="hist-card" style="flex:1;cursor:pointer" onclick="goToReportsSubTab('cog')">
        <label class="fl">Spend this month</label>
        <div style="font-size:22px;font-weight:800">$${monthSpend.toFixed(2)}</div>
      </div>
      <div class="hist-card" style="flex:1;cursor:pointer" onclick="goToReportsSubTab('reports')">
        <label class="fl">Breakage this month</label>
        <div style="font-size:22px;font-weight:800;color:${breakageTotal>0?'var(--crit)':'var(--txt)'}">$${breakageTotal.toFixed(2)}</div>
      </div>
    </div>

    <label class="fl" style="margin-top:16px">Recent activity</label>
    ${recent.length ? recent.map(h=>`<div class="hist-card" style="padding:12px 16px;cursor:pointer" onclick="goToReportsSubTab('history')">
        <div style="display:flex;justify-content:space-between">
          <span style="font-weight:700">${esc(h.supplier)} · ${esc(h.type||'order')}</span>
          <span style="color:var(--dim);font-size:13px">${esc(h.date)}</span>
        </div>
      </div>`).join('') : `<div class="empty">
        <div style="font-size:34px;margin-bottom:10px;opacity:.5">👋</div>
        <div style="color:var(--paper);font-weight:600;font-size:15px">Nothing saved yet</div>
        <div>Place an order or start an inventory count to see activity here.</div>
      </div>`}`;
}

function historyView(){
  if(!state.history.length) return `<div class="empty">
    <div style="font-size:34px;margin-bottom:10px;opacity:.5">🕐</div>
    <div style="color:var(--paper);font-weight:600;font-size:15px;margin-bottom:6px">No saved records yet</div>
    <div>Orders and inventory counts you save will show up here.<br>
    Head to <b style="color:var(--ember)">Order</b> or <b style="color:var(--ember)">Inventory</b> to get started.</div>
  </div>`;
  return state.history.map((h,idx)=>{
    const n = (h.items||[]).filter(i=>(+i.orderQty||0)>0).length;
    const counted = (h.items||[]).filter(i=>i.onHand!=null||i.count!=null).length;
    const label = n>0 ? `${n} item${n!==1?'s':''}` : (counted>0 ? `${counted} counted` : '0 items');
    return `<div class="hist-card" onclick="openRecord(${idx})">
      <span class="cnt">${label}</span>
      <div class="date">${esc(h.date)}</div>
      <div class="sup">${esc(h.supplier)} · ${esc(h.type||'order')}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   PRICE TRACKER — log price changes over time per item, see year-over-
   year trend, and spot items worth reconsidering. state.priceHistory
   keyed by item id: [{ts,date,price,prevPrice,delta,deltaPct}, ...],
   always appended chronologically. it.unitCost always mirrors the
   latest recorded price, so every other feature (breakage $, COGS,
   Order edit view) stays correct without special-casing this data.
   ═══════════════════════════════════════════════════════════════════ */

// A price counts as "real" for tracking/summary purposes once it's a
// positive number — $0/null both mean "not priced yet" (same convention
// already used for breakage $ elsewhere in the app).
function hasRealPrice(it){ return !!(it && it.unitCost!=null && +it.unitCost>0); }

// Pure: record a price change against an item. Returns true if a new
// history entry was actually logged (false if the price didn't change,
// so callers don't create noise entries or false "updated" toasts).
// Does NOT persist — callers persist 'priceHistory' and 'catalog'.
function logPriceChange(sn, id, newPrice){
  const it = state.catalog[sn] && state.catalog[sn].items.find(i=>i.id===id);
  if(!it) return false;
  const prevPrice = (it.unitCost!=null && it.unitCost!=='') ? +it.unitCost : null;
  if(prevPrice===newPrice) return false;
  const delta = prevPrice!=null ? +(newPrice-prevPrice).toFixed(4) : null;
  const deltaPct = (prevPrice!=null && prevPrice!==0) ? +((delta/prevPrice)*100).toFixed(2) : null;
  if(!state.priceHistory[id]) state.priceHistory[id]=[];
  const arr = state.priceHistory[id];
  // Guarantee a strictly-increasing, always-unique ts per item — two updates
  // logged within the same millisecond would otherwise collide, and since
  // deletePriceEntry identifies an entry BY ts, a collision could delete the
  // wrong one (or both at once).
  let ts = Date.now();
  if(arr.length && ts<=arr[arr.length-1].ts) ts = arr[arr.length-1].ts+1;
  const entry = {
    ts, date: new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    price: newPrice, prevPrice, delta, deltaPct,
  };
  arr.push(entry);
  it.unitCost = newPrice;
  return true;
}

// Pure: how has this item's price moved over roughly the last year?
// Each history entry marks "the price became X on this date"; the entry's
// own prevPrice tells us what it was immediately before that — the only
// way to know anything about the price before tracking started. So the
// real known timeline is: [prevPrice of the oldest entry (if known), then
// each entry's own price] — NOT just the raw list of logged prices, or a
// single logged change would incorrectly compare the new price to itself.
// Baseline = the most recent point at least 365 days old; if everything
// on record is younger than that, falls back to the earliest known point.
const YEAR_MS = 365*24*60*60*1000;
function priceTrend(hist, currentPrice, now){
  if(!hist || !hist.length || currentPrice==null) return {pct:null, amt:null, baselineDate:null};
  const sorted = hist.slice().sort((a,b)=>a.ts-b.ts);
  const points = [];
  if(sorted[0].prevPrice!=null){
    points.push({ts: sorted[0].ts-1, price: sorted[0].prevPrice, date:'before tracking began'});
  }
  for(const e of sorted) points.push({ts: e.ts, price: e.price, date: e.date});

  const cutoff = (now||Date.now()) - YEAR_MS;
  let baseline = null;
  for(const p of points){ if(p.ts<=cutoff) baseline=p; else break; }
  if(!baseline) baseline = points[0];
  const amt = +(currentPrice - baseline.price).toFixed(4);
  const pct = baseline.price ? +((amt/baseline.price)*100).toFixed(2) : null;
  return {pct, amt, baselineDate: baseline.date};
}

// Small dependency-free SVG sparkline for the last up-to-12 price points.
function buildSparkline(histAsc){
  const pts = histAsc.slice(-12);
  if(pts.length<2) return '';
  const prices = pts.map(e=>e.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || 1;
  const w=300, h=56, pad=6;
  const stepX = pts.length>1 ? (w-2*pad)/(pts.length-1) : 0;
  const coords = prices.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const upOverall = prices[prices.length-1] > prices[0];
  const downOverall = prices[prices.length-1] < prices[0];
  const color = upOverall ? 'var(--crit)' : downOverall ? 'var(--ok)' : 'var(--dim)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:56px;margin:10px 0;display:block">
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function priceView(){
  const sn = state.activeSupp;
  const items = state.catalog[sn].items;

  const rows = items.map(it=>{
    const hist = state.priceHistory[it.id]||[];
    const trend = priceTrend(hist, it.unitCost);
    return {it, hist, trend};
  }).sort((a,b)=> Math.abs(b.trend.pct||0) - Math.abs(a.trend.pct||0));

  const pricedCount = items.filter(hasRealPrice).length;
  const trackedCount = rows.filter(r=>r.hist.length>0).length;
  const movers = rows.filter(r=>r.trend.pct!=null && r.trend.pct!==0);
  const biggest = movers[0]; // already sorted by |pct| desc

  const summary = `<div style="display:flex;gap:8px;margin:8px 0 4px">
    <div class="hist-card" style="flex:1;text-align:center;padding:12px 6px">
      <div style="font-size:20px;font-weight:800">${pricedCount}/${items.length}</div>
      <div style="font-size:10px;color:var(--dim)">PRICED</div>
    </div>
    <div class="hist-card" style="flex:1;text-align:center;padding:12px 6px">
      <div style="font-size:20px;font-weight:800">${trackedCount}</div>
      <div style="font-size:10px;color:var(--dim)">TRACKED</div>
    </div>
    ${biggest ? `<div class="hist-card" style="flex:1.4;text-align:center;padding:12px 6px;
        border-color:${biggest.trend.pct>0?'#e14b4b55':'#4fa65b55'}">
      <div style="font-size:20px;font-weight:800;color:${biggest.trend.pct>0?'var(--crit)':'var(--ok)'}">
        ${biggest.trend.pct>0?'▲':'▼'}${Math.abs(biggest.trend.pct).toFixed(0)}%</div>
      <div style="font-size:10px;color:var(--dim)">BIGGEST MOVER</div>
    </div>` : ''}
  </div>`;

  const rowsHtml = rows.map(({it,hist,trend})=>{
    const priceStr = it.unitCost!=null ? '$'+(+it.unitCost).toFixed(2) : '—';
    const trendTag = trend.pct==null
      ? `<span style="font-size:11px;color:var(--dim)">not tracked yet</span>`
      : trend.pct===0
        ? `<span style="font-size:11px;color:var(--dim)">no change</span>`
        : `<span style="font-size:11px;font-weight:700;color:${trend.pct>0?'var(--crit)':'var(--ok)'}">
            ${trend.pct>0?'▲':'▼'} ${Math.abs(trend.pct).toFixed(1)}% since ${esc(trend.baselineDate)}</span>`;
    const reconsider = (trend.pct!=null && trend.pct>=15)
      ? `<div style="font-size:11px;color:var(--crit);margin-top:2px">⚠ Up sharply — worth a second look</div>` : '';
    return `<div class="item" onclick="openPriceDetail('${sn}','${it.id}')" style="cursor:pointer">
      <div class="item-main">
        <div class="item-name">${esc(it.name)}</div>
        <div class="item-meta">${trendTag}</div>
        ${reconsider}
      </div>
      <div style="font-size:19px;font-weight:800;font-family:'Roboto Mono',monospace;color:var(--accent)">${priceStr}</div>
    </div>`;
  }).join('');

  return `<div class="sched">Tap any item to log a new price or see its history.</div>
    ${summary}
    ${items.length ? rowsHtml : '<div class="empty">No items for this supplier yet.</div>'}
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="exportPriceListCsv()">📄 Export price list CSV</button>
      <button class="btn ghost" onclick="exportPriceListPdf()">🖨 Print price list</button>
    </div>
    <div class="sched">Prints every item across all suppliers — one document to hand off, sized for
      walking the stock like an inventory sheet.</div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn ghost" onclick="exportPriceTemplateCsv()">📄 ${esc(sn)} price-update CSV</button>
      <button class="btn ghost" onclick="exportPriceTemplatePdf()">📝 ${esc(sn)} price-update template</button>
    </div>
    <div class="sched">Item, item #, and current price for ${esc(sn)} only — with a blank column to write
      the new price while cross-checking a new price sheet.</div>`;
}

/* ── Current price list — a snapshot to print and hand off, distinct from
   the price CHANGE report (which is a date-range log of edits). This
   covers every item, every supplier, in catalog/walking order, grouped
   into supplier sections like a physical inventory sheet. ── */
function buildPriceListReport(){
  const rows = [];
  for(const sn of SUP_NAMES){
    for(const it of state.catalog[sn].items){
      const hist = state.priceHistory[it.id]||[];
      const lastUpdated = hist.length ? hist[hist.length-1].date : null;
      const casePrice = (it.unitCost!=null && it.caseQty>1) ? +(it.unitCost*it.caseQty).toFixed(2) : null;
      rows.push({
        supplier: sn, name: it.name, itemNum: it.itemNum||'', pack: it.pack||'',
        unitCost: it.unitCost!=null ? it.unitCost : null,
        caseQty: it.caseQty||null, casePrice, lastUpdated,
      });
    }
  }
  const pricedCount = rows.filter(r=>r.unitCost!=null && r.unitCost>0).length;
  return { rows, pricedCount, unpricedCount: rows.length-pricedCount };
}

function exportPriceListCsv(){
  const data = buildPriceListReport();
  if(!data.rows.length){ toast('Nothing to export','warn'); return; }
  const header = ['Item','Supplier','Item #','Pack','Price/unit','Units/case','Price/case','Last updated'];
  const rows = data.rows.map(r=>[r.name,r.supplier,r.itemNum,r.pack,
    r.unitCost??'', r.caseQty??'', r.casePrice??'', r.lastUpdated||'']);
  const csv = [header, ...rows].map(row=>row.map(v=>{
    const s=String(v); return /[,"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download = `Bartletts-price-list-${isoDate(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('CSV downloaded','ok');
}

function openPriceDetail(sn, id){
  const it = state.catalog[sn].items.find(i=>i.id===id);
  if(!it) return;
  const histAsc = (state.priceHistory[id]||[]).slice().sort((a,b)=>a.ts-b.ts);
  const trend = priceTrend(histAsc, it.unitCost);
  const sparkline = buildSparkline(histAsc);

  const histRowsHtml = histAsc.slice().reverse().map(e=>{
    const deltaHtml = e.delta==null
      ? `<span style="color:var(--dim)">first recorded price</span>`
      : `<span style="color:${e.delta>0?'var(--crit)':e.delta<0?'var(--ok)':'var(--dim)'}">
          ${e.delta>0?'▲':e.delta<0?'▼':'—'} $${Math.abs(e.delta).toFixed(2)}
          ${e.deltaPct!=null ? ` (${e.deltaPct>0?'+':''}${e.deltaPct.toFixed(1)}%)` : ''}</span>`;
    return `<div class="entry">
      <span class="n" style="font-weight:400;font-size:13px">
        ${esc(e.date)} · $${e.price.toFixed(2)} · ${deltaHtml}</span>
      <button class="x" onclick="deletePriceEntry('${sn}','${id}',${e.ts})">×</button>
    </div>`;
  }).join('');

  modal(`<h2>${esc(it.name)}</h2>
    <div class="sched">${esc(sn)}${it.itemNum?' · #'+esc(it.itemNum):''}${it.pack?' · '+esc(it.pack):''}</div>
    <div style="font-size:34px;font-weight:800;color:var(--accent);font-family:'Roboto Mono',monospace">
      ${it.unitCost!=null?'$'+(+it.unitCost).toFixed(2):'—'}</div>
    ${trend.pct!=null && trend.pct!==0 ? `<div class="sched" style="color:${trend.amt>0?'var(--crit)':'var(--ok)'}">
      ${trend.amt>0?'▲':'▼'} ${Math.abs(trend.pct).toFixed(1)}% (${trend.amt>0?'+':''}$${trend.amt.toFixed(2)}) since ${esc(trend.baselineDate)}</div>` : ''}
    ${sparkline}
    <label class="fl">Log a new price — price per unit</label>
    <input class="field" id="price-new" inputmode="decimal" placeholder="0.00">
    <div class="sched" style="text-align:center;margin:2px 0">— or, if you have a case price —</div>
    <div style="display:flex;gap:8px">
      <input class="field" id="price-case-total" inputmode="decimal" placeholder="Price per case"
        style="flex:1" oninput="updateCasePreview()">
      <input class="field" id="price-case-size" inputmode="decimal" placeholder="Units/case"
        value="${it.caseQty!=null?esc(it.caseQty):''}" style="flex:1" oninput="updateCasePreview()">
    </div>
    <div class="sched" id="case-preview" style="min-height:18px"></div>
    <button class="btn" onclick="savePriceUpdate('${sn}','${id}')">Save price</button>
    <label class="fl" style="margin-top:16px">History</label>
    ${histRowsHtml || '<div class="sched">No price history yet — log the first one above.</div>'}`);
}

// Live "= $X.XX/unit" feedback as the case fields are filled in, computed
// directly against the DOM so it doesn't need a full app re-render (which
// would lose focus/keystrokes mid-type).
function updateCasePreview(){
  const totalEl=$('price-case-total'), sizeEl=$('price-case-size'), out=$('case-preview');
  if(!totalEl || !sizeEl || !out) return;
  const total=+totalEl.value, size=+sizeEl.value;
  if(totalEl.value!=='' && sizeEl.value!=='' && size>0 && !isNaN(total) && total>=0){
    out.textContent = `= $${(total/size).toFixed(4)} per unit`;
    out.style.color = 'var(--ok)';
  } else {
    out.textContent = (totalEl.value!=='' || sizeEl.value!=='') ? 'Enter both a case price and units per case' : '';
    out.style.color = 'var(--dim)';
  }
}

function savePriceUpdate(sn, id){
  const it = state.catalog[sn].items.find(i=>i.id===id);
  if(!it) return;

  // Case price takes precedence when BOTH case fields are actually filled in;
  // otherwise fall back to the direct per-unit field. This avoids any
  // ambiguous "which one wins" state — whichever the person actually used.
  const caseTotalEl = $('price-case-total'), caseSizeEl = $('price-case-size');
  const caseFilledIn = caseTotalEl && caseSizeEl && caseTotalEl.value!=='' && caseSizeEl.value!=='';

  let newPrice;
  if(caseFilledIn){
    const caseTotal = +caseTotalEl.value, caseSize = +caseSizeEl.value;
    if(isNaN(caseTotal) || caseTotal<0){ toast('Enter a valid case price','warn'); return; }
    if(!(caseSize>0)){ toast('Units per case must be greater than 0','warn'); return; }
    newPrice = +(caseTotal/caseSize).toFixed(4);
    it.caseQty = caseSize;   // remember it for next time
  } else {
    const el = $('price-new');
    const val = el ? el.value : '';
    if(val===''){ toast('Enter a price','warn'); return; }
    newPrice = +val;
    if(isNaN(newPrice) || newPrice<0){ toast('Enter a valid price','warn'); return; }
  }

  const prevPrice = it.unitCost;
  const changed = logPriceChange(sn, id, newPrice);
  if(!changed){ toast('That\'s already the current price','warn'); return; }
  persist('priceHistory'); persist('catalog');
  closeModal(); render();
  const perUnitNote = caseFilledIn ? ` ($${newPrice.toFixed(2)}/unit)` : '';
  toast(prevPrice!=null ? `Updated: $${(+prevPrice).toFixed(2)} → $${newPrice.toFixed(2)}${perUnitNote}` : `First price recorded: $${newPrice.toFixed(2)}${perUnitNote}`, 'ok');
}

function deletePriceEntry(sn, itemId, ts){
  confirmModal('Delete this price record?\nThis can\'t be undone.', ()=>{
    const arr = state.priceHistory[itemId]||[];
    const latestTs = arr.length ? Math.max(...arr.map(e=>e.ts)) : null;
    const wasLatest = latestTs===ts;
    state.priceHistory[itemId] = arr.filter(e=>e.ts!==ts);
    if(wasLatest){
      const remaining = state.priceHistory[itemId];
      const it = state.catalog[sn].items.find(i=>i.id===itemId);
      if(it) it.unitCost = remaining.length ? remaining[remaining.length-1].price : null;
      persist('catalog');
    }
    persist('priceHistory');
    closeModal();
    openPriceDetail(sn, itemId);
    render();
  }, 'Delete');
}

/* ── COGS VIEW — spend derived from actual saved orders ── */
/* ═══════════════════════════════════════════════════════════════════
   OTHER EXPENSES — a real ledger (concept, amount, date) instead of the
   old single lump "other spend" number per month, which had no breakdown
   and no history — you could only ever see the total, never what made it
   up. Feeds into COGS the same way order spend does: summed by month.
   ═══════════════════════════════════════════════════════════════════ */
function monthKeyOf(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// One-time: fold any legacy cog.manual monthly lump sums into the new
// ledger as a single synthetic entry per month, so old data isn't silently
// dropped when the calc switches over to reading state.expenses instead.
function migrateManualCogToExpenses(){
  if(state.cog.manualMigrated) return false;
  let changed = false;
  for(const mk of Object.keys(state.cog.manual||{})){
    const amt = +state.cog.manual[mk]||0;
    if(amt>0 && !state.expenses.some(e=>e.migratedFromMonth===mk)){
      state.expenses.push({
        id: 'exp-migrated-'+mk,
        date: new Date(mk+'-01T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
        ts: Date.parse(mk+'-01T12:00:00') || Date.now(),
        concept: 'Other spend (carried over from before itemized tracking)',
        amount: amt, migratedFromMonth: mk,
      });
      changed = true;
    }
  }
  state.cog.manualMigrated = true;
  return changed;
}

function expensesForMonth(mk){
  return state.expenses.filter(e => monthKeyOf(e.ts)===mk).sort((a,b)=> b.ts-a.ts);
}
function expenseTotalForMonth(mk){
  return +expensesForMonth(mk).reduce((s,e)=> s+(+e.amount||0), 0).toFixed(2);
}

function addExpense(concept, amount, dateStr){
  concept = (concept||'').trim();
  const amt = +amount;
  if(!concept){ toast('Enter what this expense was for','warn'); return false; }
  if(isNaN(amt) || amt<=0){ toast('Enter a valid amount','warn'); return false; }
  let ts = dateStr ? Date.parse(dateStr+'T12:00:00') : Date.now();
  if(isNaN(ts)) ts = Date.now();
  // Entries are looked up by id (not ts) for edit/delete, so ts only needs
  // to be unique enough to keep ids from colliding — nudge only on a real
  // exact match against an existing entry. Do NOT bump forward just because
  // an earlier-dated entry was added after a later-dated one; expenses can
  // be legitimately backdated, and that's normal, not a collision.
  while(state.expenses.some(e=>e.ts===ts)) ts += 1;
  state.expenses.push({
    id: 'exp-'+ts, ts, date: new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    concept, amount: amt,
  });
  persist('expenses');
  return true;
}

function updateExpense(id, concept, amount, dateStr){
  const e = state.expenses.find(x=>x.id===id);
  if(!e) return false;
  concept = (concept||'').trim();
  const amt = +amount;
  if(!concept){ toast('Enter what this expense was for','warn'); return false; }
  if(isNaN(amt) || amt<=0){ toast('Enter a valid amount','warn'); return false; }
  let ts = dateStr ? Date.parse(dateStr+'T12:00:00') : e.ts;
  if(isNaN(ts)) ts = e.ts;
  e.concept = concept; e.amount = amt; e.ts = ts;
  e.date = new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  persist('expenses');
  return true;
}

function deleteExpense(id){
  confirmModal('Delete this expense?\nThis can\'t be undone.', ()=>{
    state.expenses = state.expenses.filter(e=>e.id!==id);
    persist('expenses'); closeModal(); render(); toast('Expense deleted','ok');
  }, 'Delete');
}

let _repFilter = null;   // lazily initialized from defaultReportFilter()
let _repMode = 'list';   // 'list' | 'yoy'
let _repBreakageExpanded = false;
function toggleReportBreakageExpanded(){ _repBreakageExpanded = !_repBreakageExpanded; render(); }

/* ── Select-to-print: tick rows, then Print/CSV use only those rows.
      Nothing ticked = everything in view (button says "all"). Ticks are kept
      by row key, so they survive filter changes; only rows currently in view
      are ever counted or printed. ── */
const _sel = {orders:new Set(), price:new Set()};
const _selKeys = {orders:[], price:[]};          // row index on screen → key
const SEL_KEY = {
  orders: r=> r.supplier+'|'+r.type+'|'+r.name,
  price:  r=> r.supplier+'|'+r.name+'|'+r.ts+'|'+r.price,
};
function pickSelected(kind, rows){
  const set = _sel[kind];
  if(!set.size) return {rows, picked:false};
  return {rows: rows.filter(r=> set.has(SEL_KEY[kind](r))), picked:true};
}
function selCount(kind){ return _selKeys[kind].filter(k=>_sel[kind].has(k)).length; }
function selLabel(kind, verb){
  const n = selCount(kind);
  return n ? verb+' selected ('+n+')' : verb+' all ('+_selKeys[kind].length+')';
}
function selInfo(kind){
  const n = selCount(kind);
  return n ? n+' of '+_selKeys[kind].length+' selected' : 'Tick items to print only those';
}
function selRefresh(kind){
  const set = (id,t)=>{ const el=document.getElementById(id+kind); if(el) el.textContent=t; };
  set('sel-info-', selInfo(kind));
  set('btn-pdf-', '🖨 '+selLabel(kind,'Print'));
  set('btn-csv-', '📄 '+selLabel(kind,'CSV'));
}
function selToggle(kind, i, on){
  const k = _selKeys[kind][i]; if(k==null) return;
  if(on) _sel[kind].add(k); else _sel[kind].delete(k);
  selRefresh(kind);
}
function selAll(kind, on){
  _selKeys[kind].forEach(k=>{ if(on) _sel[kind].add(k); else _sel[kind].delete(k); });
  document.querySelectorAll('.selbox-'+kind).forEach(b=>{ b.checked = on; });
  selRefresh(kind);
}
function selCell(kind, key, i){
  _selKeys[kind][i] = key;
  return `<label style="display:flex;align-items:center;padding:6px 8px 6px 0;margin:-6px 0 -6px -4px">
    <input type="checkbox" class="selbox-${kind}" style="width:20px;height:20px" ${_sel[kind].has(key)?'checked':''}
      onchange="selToggle('${kind}',${i},this.checked)"></label>`;
}
function selBar(kind){
  return `<div class="sched" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px">
      <span id="sel-info-${kind}">${selInfo(kind)}</span>
      <span><button class="btn ghost" style="padding:6px 10px;width:auto;display:inline-block;margin:0 0 0 6px" onclick="selAll('${kind}',true)">Select all</button>
      <button class="btn ghost" style="padding:6px 10px;width:auto;display:inline-block;margin:0 0 0 6px" onclick="selAll('${kind}',false)">Clear</button></span></div>`;
}
/* Summary figures for exactly the rows being printed. */
function breakageOf(rows){
  return {
    total: +rows.reduce((s,r)=> s+(r.breakageValue||0), 0).toFixed(2),
    known: rows.filter(r=>r.breakageQty>0 && r.breakageValue!=null).length,
    unpriced: rows.filter(r=>r.breakageQty>0 && r.breakageValue==null).length,
  };
}

// Shared by both the order/inventory report and the price-change report —

function reportView(){

  const f = _repFilter;
  if(f.types==='price') return priceReportView(f);

  const data = _repMode==='yoy'
    ? buildYoyComparison(state.history, f)
    : buildReport(state.history, f);

  const rows = data.rows;
  const grandQty = rows.reduce((s,r)=>s+r.totalQty,0);
  const grandCost = rows.reduce((s,r)=> s+(r.totalCost||0), 0);

  // ── Breakage summary (only meaningful when Inventory records are in view) ──
  const showBreakage = f.types!=='order' && (data.breakageTotal>0 || data.breakageUnpricedCount>0 || data.breakageKnownCount>0);
  const breakRows = rows.filter(r=>r.breakageQty>0).sort((a,b)=> (b.breakageValue||0)-(a.breakageValue||0));
  const _repShowAllBreakage = !!_repBreakageExpanded;

  const breakageSection = !showBreakage ? '' : `

          <div style="font-size:11px;color:var(--dim)">TOTAL BREAKAGE</div>
        </div>
        <div class="hist-card" style="flex:1;text-align:center;padding:14px 8px">
          <div style="font-size:22px;font-weight:800">${data.breakageKnownCount}</div>
          <div style="font-size:11px;color:var(--dim)">ITEMS PRICED</div>
        </div>
        ${data.breakageUnpricedCount>0?`<div class="hist-card" style="flex:1;text-align:center;padding:14px 8px;border-color:var(--low)">
          <div style="font-size:22px;font-weight:800;color:var(--low)">${data.breakageUnpricedCount}</div>
          <div style="font-size:11px;color:var(--dim)">UNPRICED</div>
        </div>`:''}
      </div>
      ${data.breakageUnpricedCount>0?`<div class="sched" style="color:var(--low)">
        ${data.breakageUnpricedCount} item${data.breakageUnpricedCount!==1?'s':''} had shortages but no price set,
        so they're not counted in the total above. Set a price in ✎ Edit items to include them.</div>`:''}
      ${breakRows.length ? visibleBreakRows.map(r=>`
        <div class="item">
          <div class="item-main">
            <div class="item-name">${esc(r.name)}</div>

          <div style="font-size:18px;font-weight:800;color:${r.breakageValue?'var(--crit)':'var(--dim)'}">

        </div>`).join('')
        : '<div class="sched">No breakage in this range — nice.</div>'}
      ${hiddenBreakCount>0
        ? `<button class="btn ghost" onclick="toggleReportBreakageExpanded()">Show ${hiddenBreakCount} more (smaller or unpriced) →</button>`
        : (_repShowAllBreakage && breakRows.length>8)
          ? `<button class="btn ghost" onclick="toggleReportBreakageExpanded()">Show top items only</button>`

    </div>`;

  _selKeys.orders = [];
  const rowsHtml = rows.length ? rows.map((r,i)=>{
    const deltaHtml = (_repMode==='yoy')
      ? (r.priorQty==null
          ? `<span style="color:var(--dim);font-size:12px">new item</span>`

    // Inventory rows: "Qty" would be the REORDER amount (par − count), which
    // is misleadingly 0 for anything already stocked above par even when it

    const isInventory = r.type==='inventory';

      <span><b>${rows.length}</b> item${rows.length!==1?'s':''} · <b>${data.recordCount}</b> record${data.recordCount!==1?'s':''}</span>

function toggleReportSupplier(sn){

  let cur = Array.isArray(_repFilter.suppliers) ? _repFilter.suppliers.slice() : [];

/* ═══════════════════════════════════════════════════════════════════
   ORDER CHANNEL ROUTING (Trimark counted, but ordered elsewhere)
   Each item may carry orderChannel: 'text' | 'bek' | 'email'.
   Counting is unified in Trimark; ordering is routed here.
   ═══════════════════════════════════════════════════════════════════ */

// Build the list of Trimark items that need ordering, grouped by channel.
// Units needed -> whole cases, rounded UP (you can't order 3.4 cases).
// caseQty missing or <=1 means "not sold by the case" — leave as raw units.
function unitsToCases(units, caseQty){
  const cq = +caseQty || 0;
  if(cq<=1) return units;
  return Math.ceil(units/cq);
}

function trimarkOrderGroups(){
  const groups = { james:[], text:{}, bek:[], email:{} };
  for(const it of state.catalog['TRIMARK'].items){
    const t = state.trimark[it.id]||{};
    const r = trimarkRow(t.begin, t.add, t.count, it.par, it.unitCost);
    const ch = it.orderChannel;

    if(ch==='text'){
      // Manual reorder (firewood): NOT par-driven. Always available to send,
      // but flagged manual so the UI doesn't imply it's "due".
      const key = it.textNumber||'';
      (groups.text[key] = groups.text[key]||[]).push({
        name:it.name, orderQty: it.fixedQty||0, label:it.textLabel||it.name, manual:true
      });
    } else if(ch==='bek'){
      // BEK's CSV column is literally "Each" — stays unit-based, unchanged.
      if(r.order>0) groups.bek.push({name:it.name, itemNum:it.itemNum||'', orderQty:r.order});
    } else if(ch==='email'){
      if(r.order>0){
        const key = it.altEmail||'';
        (groups.email[key] = groups.email[key]||[]).push({
          name:it.name, vendor:it.altVendor||'',
          orderQty: unitsToCases(r.order, it.caseQty), unitsNeeded: r.order, caseQty: it.caseQty||null,
        });
      }
    } else {
      // Default Trimark → James. This is what you actually ask James for,
      // so round up to whole cases (you can't order a partial case).
      if(r.order>0) groups.james.push({
        name:it.name, itemNum:it.itemNum||'',
        orderQty: unitsToCases(r.order, it.caseQty), unitsNeeded: r.order, caseQty: it.caseQty||null,
      });
    }
  }
  return groups;
}

// Count how many distinct order actions the current inventory implies.
function trimarkChannelSummary(){
  const g = trimarkOrderGroups();
  const out = [];
  if(g.james.length) out.push({key:'james', label:`Email James`, n:g.james.length});
  Object.entries(g.text).forEach(([num,items])=>{
    const n = items.length; // firewood etc. — manual reorder, not par-driven
    out.push({key:'text:'+num, label:`Text order: ${items.map(i=>i.label).join(', ')} (manual)`,
      n, num, items, manual:true});
  });
  if(g.bek.length) out.push({key:'bek', label:`Add to BEK CSV`, n:g.bek.length, items:g.bek});
  Object.entries(g.email).forEach(([email,items])=>{
    const vendor = items[0]?.vendor || 'other vendor';
    out.push({key:'email:'+email, label:`Email ${vendor}`, n:items.length, email, items});
  });
  return out;
}

// Fire a specific channel.
function sendTrimarkChannel(key){
  const g = trimarkOrderGroups();
  if(key==='james'){
    if(!g.james.length){ toast('Nothing to order from James','warn'); return; }
    return sendEmail('TRIMARK', g.james);
  }
  if(key==='bek'){
    if(!g.bek.length){ toast('No BEK-routed items to order','warn'); return; }
    downloadBekCsv(g.bek);
    toast('Fryer oil added to BEK CSV','ok');
    return;
  }
  if(key.startsWith('text:')){
    const num = key.slice(5);
    const items = g.text[num]||[];
    if(!items.length){ toast('No text items','warn'); return; }
    if(!num){ editChannelTarget('text'); return; }   // no number set → prompt to add it
    const body = items.map(i=>`${i.label}: ${i.orderQty}`).join('\n');
    window.location.href = `sms:${num}&body=${encodeURIComponent('Bartlett\'s order:\n\n'+body+'\n\nThanks')}`;
    return;
  }
  if(key.startsWith('email:')){
    const email = key.slice(6);
    const g2 = trimarkOrderGroups().email;
    const items = g2[email]||[];
    if(!items.length){ toast('No items for this vendor','warn'); return; }
    if(!email){ editChannelTarget('email'); return; }  // no email set → prompt
    const vendor = items[0]?.vendor||'';
    const subject = `Bartlett's order — ${new Date().toLocaleDateString()}`;
    const body = `Hello${vendor?' '+vendor:''},\n\nPlease process the following order for Bartlett's:\n\n`+
      items.map(i=> (i.caseQty && i.caseQty>1)
        ? `${i.orderQty} case${i.orderQty!==1?'s':''} × ${i.name} (${i.caseQty}/cs, ${i.unitsNeeded} ct needed)`
        : `${i.orderQty} × ${i.name}`
      ).join('\n')+`\n\nThank you,\nBartlett's Restaurant`;
    openEmailChoice(email, subject, body);
    return;
  }
}

function isDefaultItem(sn, id){
  return (DEFAULT_SUPPLIERS[sn]?.items||[]).some(d=>d.id===id);
}

// Open the edit sheet for one item.
function editItem(sn, id){
  const it = state.catalog[sn].items.find(i=>i.id===id);
  if(!it) return;
  const isTri = sn==='TRIMARK';
  const isBek = sn==='BEK';
  modal(`<h2>Edit item</h2>
    <label class="fl">Name</label>
    <input class="field" id="e-name" value="${esc(it.name)}">
    <label class="fl">Pack / presentation</label>
    <input class="field" id="e-pack" value="${esc(it.pack||'')}" placeholder="e.g. 250 ct, case, each">
    <label class="fl">Par level</label>
    <input class="field" id="e-par" inputmode="decimal" value="${it.par!=null?esc(it.par):''}" placeholder="0">
    <label class="fl">Price per unit ($)</label>
    <input class="field" id="e-cost" inputmode="decimal" value="${it.unitCost!=null?esc(it.unitCost):''}" placeholder="0.00">
    <label class="fl">Units per case <span style="color:var(--dim);font-weight:400">(so you can log a case price in Prices and get the per-unit cost)</span></label>
    <input class="field" id="e-caseqty" inputmode="decimal" value="${it.caseQty!=null?esc(it.caseQty):''}" placeholder="e.g. 12">
    ${(isBek||it.itemNum!=null)?`<label class="fl">${isBek?'BEK ':''}Item #</label>
      <input class="field" id="e-num" value="${esc(it.itemNum||'')}" placeholder="optional">`:''}
    <button class="btn" onclick="saveItem('${sn}','${id}')">Save changes</button>
    <button class="btn ghost" onclick="deleteItem('${sn}','${id}')" style="color:var(--crit)">🗑 Delete item</button>`);
}

function saveItem(sn, id){
  const it = state.catalog[sn].items.find(i=>i.id===id);
  if(!it) return;
  const name=($('e-name').value||'').trim();
  if(!name){ toast('Name can\'t be empty','warn'); return; }
  it.name = name;
  it.pack = ($('e-pack').value||'').trim();
  const par=$('e-par').value;   it.par = par===''?null:(+par||0);
  const costStr=$('e-cost').value;
  if(costStr===''){ it.unitCost = null; }
  else if(logPriceChange(sn, id, +costStr||0)){ persist('priceHistory'); }
  const caseQtyStr=$('e-caseqty').value;
  it.caseQty = caseQtyStr==='' ? null : (+caseQtyStr||null);
  const numEl=$('e-num'); if(numEl) it.itemNum = (numEl.value||'').trim();
  persist('catalog'); closeModal(); render(); toast('Item updated','ok');
}

function deleteItem(sn, id){
  const it = state.catalog[sn].items.find(i=>i.id===id);
  confirmModal(`Delete "${it?it.name:id}"?\nThis removes it from ordering and inventory.`, ()=>{
    state.catalog[sn].items = state.catalog[sn].items.filter(i=>i.id!==id);
    if(isDefaultItem(sn, id)){
      state.deletedIds[sn] = state.deletedIds[sn]||[];
      if(!state.deletedIds[sn].includes(id)) state.deletedIds[sn].push(id);
      persist('deletedIds');
    }
    delete state.orderQty[id]; delete state.onHand[id]; delete state.trimark[id];
    persist('catalog'); persist('orderQty'); persist('trimark');
    closeModal(); render(); toast('Item deleted','ok');
  }, 'Delete item');
}

// Add a brand-new item to the active supplier (or TRIMARK on inventory tab).
function addItem(sn){
  const isTri = sn==='TRIMARK';
  const isBek = sn==='BEK';
  modal(`<h2>Add item to ${esc(sn)}</h2>
    <label class="fl">Name</label>
    <input class="field" id="a-name" placeholder="Item name" autofocus>
    <label class="fl">Pack / presentation</label>

    <label class="fl">Price per unit ($)</label>

    ${isBek?`<label class="fl">BEK Item #</label>

function confirmAddItem(sn){
  const name=($('a-name').value||'').trim();
  if(!name){ toast('Enter a name','warn'); return; }
  const par=$('a-par').value, cost=$('a-cost').value;
  const numEl=$('a-num');
  const item = {
    id: 'custom-'+sn.toLowerCase()+'-'+Date.now(),
    name,
    pack: ($('a-pack').value||'').trim(),
    par: par===''?null:(+par||0),
    unitCost: cost===''?null:(+cost||0),
  };
  if(numEl && numEl.value.trim()) item.itemNum = numEl.value.trim();
  state.catalog[sn].items.push(item);
  persist('catalog'); closeModal(); render(); toast('Item added','ok');
}

/* ── Price list upload: CSV of "itemNum,unitCost" updates catalog prices ── */
function uploadPriceList(){
  modal(`<h2>Upload price list</h2>
    <div class="sched">CSV format: <b>item number, price</b> (one per line).
      Matching items across all suppliers get their unit price updated.</div>
    <label class="fl">Paste CSV or choose a file</label>
    <textarea class="field" id="price-csv" rows="6" placeholder="779178,42.50&#10;118599,12.00"></textarea>
    <input type="file" id="price-file" accept=".csv,text/csv" class="field" onchange="_readPriceFile(event)">
    <button class="btn" onclick="applyPriceList()">Apply prices</button>`);
}
function _readPriceFile(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const el=$('price-csv'); if(el) el.value=r.result; };
  r.readAsText(f);
}
function applyPriceList(){
  const text=($('price-csv')?.value||'').trim();
  if(!text){ toast('Nothing to apply','warn'); return; }
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  let updated=0, skipped=0;
  for(let i=0;i<lines.length;i++){
    const parts=lines[i].split(',').map(s=>s.trim().replace(/"/g,''));
    if(parts.length<2){ skipped++; continue; }
    const num=parts[0], cost=parseFloat(parts[1]);
    if(i===0 && isNaN(parseFloat(parts[0])) ) continue; // header row
    if(!num || isNaN(cost) || cost<0){ skipped++; continue; }
    for(const sn of SUP_NAMES){
      for(const it of state.catalog[sn].items){
        if(String(it.itemNum||'')===String(num)){ it.unitCost=cost; updated++; }
      }
    }
  }
  persist('catalog'); closeModal(); render();
  toast(`${updated} price(s) updated${skipped?`, ${skipped} skipped`:''}`, updated?'ok':'warn');
}

function setTab(t){ state.tab=t; render(); }
function setSupp(sn){ state.activeSupp=sn; render(); }

/* ── Order quantity ── */
function setQty(id,v){
  const n = Math.max(0, Math.floor(+v||0));
  if(n>0){ state.orderQty[id]=n; if(state.skipped[id]){ delete state.skipped[id]; persist('skipped'); } }
  else delete state.orderQty[id];
  persist('orderQty'); render();
}
function bumpQty(id,d){
  const n = Math.max(0,(+state.orderQty[id]||0)+d);
  if(n>0){ state.orderQty[id]=n; if(state.skipped[id]){ delete state.skipped[id]; persist('skipped'); } }
  else delete state.orderQty[id];
  persist('orderQty'); render();
}
function clearOrder(sn){
  confirmModal(`Clear all ${sn} order quantities?\nThis also un-skips any items you'd marked "checked, no order needed" for this supplier.`, ()=>{
    for(const it of state.catalog[sn].items) delete state.orderQty[it.id];
    persist('orderQty');
    clearSkipsForSupplier(sn);
    render(); toast('Order cleared');
  }, 'Clear order');
}

/* ── "Checked, no order needed" ─────────────────────────────────────
   Marks an item reviewed-with-no-order so going back and forth on an
   order doesn't mean re-deciding on the same item every pass. Shared
   across devices. Auto-clears the moment ANY quantity is typed for that
   item (setQty/bumpQty above), and clears for a whole supplier the
   moment that supplier's order is actually sent (see sendOrder). ── */
function toggleSkip(id){
  if(state.skipped[id]) delete state.skipped[id];
  else {
    state.skipped[id]=true;
    if(state.orderQty[id]!=null){ delete state.orderQty[id]; persist('orderQty'); }
  }
  persist('skipped'); render();
}
function clearSkipsForSupplier(sn){
  let changed=false;
  for(const it of state.catalog[sn].items){
    if(state.skipped[it.id]){ delete state.skipped[it.id]; changed=true; }
  }
  if(changed) persist('skipped');
  return changed;
}

/* ── COGS ── */
function setCog(kind,mk,v){
  state.cog[kind][mk] = v===''?'':(+v||0);
  persist('cog');
}

/* ── Count sheet: area-based running tally ──────────────────────────
   Each area holds a list of entries. Add as many as you want per area
   (e.g. two silverware areas in the restaurant). Entries are deletable,
   so you can re-count one suspicious area without redoing the item.
   Save bar is sticky so the keyboard never hides it.
   ─────────────────────────────────────────────────────────────────── */
let _countTarget=null;
let _countAreas={};        // working copy: {areaName:[entries]}
let _countBegin='', _countAdd='';

function openCount(id){
  _countTarget=id;
  const t = state.trimark[id]||{};
  // Seed working areas from saved data (support old .locs and new .areas)
  const locs = getLocations();
  _countAreas={};
  for(const loc of locs) _countAreas[loc] = [];
  if(t.areas && typeof t.areas==='object'){
    for(const k of Object.keys(t.areas)){
      if(Array.isArray(t.areas[k])) _countAreas[k]=t.areas[k].slice();
    }
  } else if(t.locs && typeof t.locs==='object'){
    for(const k of Object.keys(t.locs)){
      const v=t.locs[k]; if(v!=='' && v!=null && !isNaN(+v)) _countAreas[k]=[+v];
    }
  }
  // ensure every configured location has an array
  for(const loc of locs) if(!Array.isArray(_countAreas[loc])) _countAreas[loc]=[];
  _countBegin = t.begin!=null?String(t.begin):'';
  _countAdd   = t.add!=null?String(t.add):'';
  renderCountSheet();
}

function renderCountSheet(){
  const id=_countTarget;
  const it = state.catalog['TRIMARK'].items.find(i=>i.id===id);
  const locs = getLocations();
  const total = areasTotal(_countAreas);
  const a = analyzeAreas(locs, _countAreas);

  const areaBlocks = locs.map((loc,idx)=>{
    const entries=_countAreas[loc]||[];
    const sub=areaSubtotal(entries);
    const entryRows = entries.map((n,ei)=>`
      <div class="entry">
        <span class="n">${esc(n)}</span>
        <button class="x" onclick="countRemoveEntry('${escJs(loc)}',${ei})">×</button>
      </div>`).join('');
    return `<div class="area-block">
      <div class="area-head">
        <span class="area-name"><span class="area-dot ${sub==null?'off':'on'}"></span>${esc(loc)}</span>
        <span class="area-sub ${sub==null?'unset':''}">${sub==null?'not counted':sub}</span>
      </div>
      ${entryRows}
      <div class="area-add">
        <input inputmode="numeric" id="entry-${idx}" placeholder="count here…"
          onkeydown="if(event.key==='Enter'){countAddEntry('${escJs(loc)}',${idx});}">
        <button onclick="countAddEntry('${escJs(loc)}',${idx})">＋ Add</button>
      </div>
    </div>`;
  }).join('');

  const checklist = a.allBlank ? ''
    : a.anyBlank
      ? `<div class="sched" style="color:var(--low)">⚠ Not counted yet: <b>${a.blank.map(esc).join(', ')}</b></div>`
      : `<div class="sched" style="color:var(--ok)">✓ All ${a.counted.length} areas counted.</div>`;

  // Live breakage preview: Start (begin+add) minus the running total, valued at unit cost.
  const liveRow = trimarkRow(_countBegin, _countAdd, total==null?'':total, it.par, it.unitCost);
  const breakageLine = (total!=null && liveRow.breakageQty>0)
    ? `<div class="sched" style="color:var(--crit);font-weight:600">
        ⚠ ${liveRow.breakageQty} short vs. start
        ${liveRow.breakageValue!=null ? ` — $${liveRow.breakageValue.toFixed(2)} breakage` : ' — set a unit price to see $ value'}
       </div>`
    : '';

  $('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet count-sheet"><button class="close" onclick="closeModal()">×</button>
      <h2>${esc(it.name)}</h2>
      <div class="sched">Begin ${it && (_countBegin||0)} · Add ${_countAdd||0} · Par ${it.par??'—'}</div>
      <label class="fl">Count by area — add an entry for each spot within it</label>
      ${areaBlocks}
      <button class="par-tag" style="width:100%;padding:10px;margin:6px 0" onclick="editLocations()">⚙ Edit areas</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;
        padding:14px;background:var(--panel2);border-radius:12px">
        <span style="font-size:14px;color:var(--dim)">Total count</span>
        <span style="font-size:30px;font-weight:800;color:var(--accent)">${total==null?'0':total}</span>
      </div>
      ${breakageLine}
      ${checklist}
      <label class="fl">Deliveries received this period (Add)</label>
      <input class="field" inputmode="numeric" id="pad-add" value="${esc(_countAdd)}" placeholder="0"
        onchange="_countAdd=this.value">
      <label class="fl">Begin (carried from last month)</label>
      <input class="field" inputmode="numeric" id="pad-begin" value="${esc(_countBegin)}" placeholder="0"
        onchange="_countBegin=this.value">
      <div class="save-bar"><button class="btn" onclick="countSave()">✓ Save count (${total==null?0:total})</button></div>
    </div></div>`;
}

function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function countAddEntry(loc, idx){
  const el=$('entry-'+idx); if(!el) return;
  const v=el.value.trim();
  if(v==='' || isNaN(+v)){ el.value=''; return; }
  if(!Array.isArray(_countAreas[loc])) _countAreas[loc]=[];
  _countAreas[loc].push(+v);
  renderCountSheet();
  // re-focus that area's input for fast repeated entry
  const again=$('entry-'+idx); if(again && again.focus) again.focus();
}
function countRemoveEntry(loc, ei){
  if(Array.isArray(_countAreas[loc])) _countAreas[loc].splice(ei,1);
  renderCountSheet();
}
function countSave(){
  const id=_countTarget;
  const locs=getLocations();
  const a=analyzeAreas(locs,_countAreas);
  const doSave=()=>{
    const t=state.trimark[id]||{};
    // store areas (drop empty arrays to keep it tidy) + derived count
    const areas={};
    for(const k of Object.keys(_countAreas)){
      if(Array.isArray(_countAreas[k]) && _countAreas[k].length) areas[k]=_countAreas[k].slice();
    }
    t.areas=areas;
    t.locs=areasToLocs(_countAreas);           // back-compat mirror
    t.count = a.total==null ? '' : a.total;
    t.add   = (+_countAdd||0)||'';
    t.begin = (+_countBegin||0)||'';
    state.trimark[id]=t;
    persist('trimark');
    logCountEntry(id, t);
    closeModal(); render();
    toast('Count saved','ok');
  };
  // Partial-area counts are the NORMAL case — most items live in only one
  // or two of the storage areas, not all three. Blocking every save with a
  // confirmation here was pure friction with no real safety benefit (it's
  // trivially dismissed every time, so it never actually prevented an
  // error) — up to 45 times per inventory count. The "Not counted yet"
  // line already shown in the sheet gives the same visibility without
  // stopping the save.
  doSave();
}

let _pendingLocs=null;
function addLocationRow(){

}
function removeLocation(idx){

function _collectLocNames(){

  cur.forEach((_,idx)=>{ const el=$('locname-'+idx); out.push(el?el.value:cur[idx]); });
  return _pendingLocs && _pendingLocs.length ? _pendingLocs.map((v,i)=>{const el=$('locname-'+i);return el?el.value:v;}) : out;
}
function _rerenderLocEditor(){
  const rows=_pendingLocs.map((loc,idx)=>`
    <div style="display:flex;gap:8px;margin:6px 0">
      <input class="field" style="margin:0;flex:1" id="locname-${idx}" value="${esc(loc)}">
      <button class="par-tag" style="padding:8px 12px;color:var(--crit)" onclick="removeLocation(${idx})">×</button>
    </div>`).join('');
  modal(`<h2>Storage locations</h2>
    <div class="sched">These are the places you store inventory. Counts are summed across them.</div>
    ${rows}
    <button class="btn ghost" onclick="addLocationRow()">＋ Add location</button>
    <button class="btn" onclick="saveLocations()">Save locations</button>`);
}
function saveLocations(){
  const src = _pendingLocs && _pendingLocs.length ? _pendingLocs : getLocations();
  const names = src.map((_,idx)=>{const el=$('locname-'+idx); return (el?el.value:'').trim();})
    .filter(Boolean);
  if(!names.length){ toast('Add at least one location','warn'); return; }
  state.locations = [...new Set(names)];   // de-dupe
  _pendingLocs=null;
  persist('locations'); closeModal();
  if(_countTarget){
    // Preserve in-progress entries; add empty arrays for any new areas.
    for(const loc of state.locations) if(!Array.isArray(_countAreas[loc])) _countAreas[loc]=[];
    renderCountSheet();
  } else render();
  toast('Areas saved','ok');
}

/* ── Save order to history ── */
// Pure: build the history record for whatever's currently drafted on the
// Order tab for this supplier. Returns null if there's nothing to record —
// callers use that to distinguish "nothing to do" from "did it."
function buildOrderRecord(sn){
  const items = state.catalog[sn].items
    .map(it=>({id:it.id,name:it.name,itemNum:it.itemNum||'',orderQty:+state.orderQty[it.id]||0}))
    .filter(i=>i.orderQty>0);
  if(!items.length) return null;
  return {
    date:new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),
    supplier:sn, type:'order', items, ts:Date.now()
  };
}
// File a built record and clear the draft it came from.
function commitOrderRecord(sn, rec){
  state.history.unshift(rec);
  state.learning = recordLearning(state.learning, rec);   // data only, no prediction
  for(const it of state.catalog[sn].items) delete state.orderQty[it.id];
  persist('history'); persist('learning'); persist('orderQty');
}

function saveOrder(sn){
  const rec = buildOrderRecord(sn);
  if(!rec){ toast('Nothing to save — no quantities entered','warn'); return; }
  commitOrderRecord(sn, rec);
  clearSkipsForSupplier(sn);
  render(); toast('Saved to history','ok');
}


function saveInventory(){
  const items = state.catalog['TRIMARK'].items;
  const missing = items.filter(it=>{
    const t=state.trimark[it.id]||{}; return t.count==null || t.count==='';
  });
  const counted = items.length - missing.length;
  const totalItems = items.length;
  const missingNames = missing.slice(0,8).map(it=>it.name).join(', ') + (missing.length>8 ? `, +${missing.length-8} more` : '');
  const msg = missing.length===0
    ? `Save this month's inventory and reset counts?\nAll ${totalItems} items counted.\nCounts roll into next month's Begin.`
    : `Save this month's inventory and reset counts?\n${counted} of ${totalItems} items counted — missing: ${missingNames}.\nCounted items roll into next month's Begin; the ${missing.length} missing item${missing.length!==1?'s keep':' keeps'} its current Begin unchanged, so nothing is lost — just not updated this time.`;
  confirmModal(msg, ()=>{
    const historyItems = state.catalog['TRIMARK'].items.map(it=>{
      const t=state.trimark[it.id]||{};
      const r=trimarkRow(t.begin,t.add,t.count,it.par,it.unitCost);
      return {id:it.id,name:it.name,begin:t.begin||0,add:t.add||0,count:r.counted,
        used:r.used,orderQty:r.order||0,par:it.par,unitCost:it.unitCost??null,
        breakageQty:r.breakageQty, breakageValue:r.breakageValue};
    });
    state.history.unshift({
      date:new Date().toLocaleString('en-US',{month:'long',year:'numeric'}),
      supplier:'TRIMARK', type:'inventory', items:historyItems, ts:Date.now()
    });
    // Roll count -> next begin, clear add/count/areas for the fresh month.
    // An item that wasn't counted this period must NOT lose its entry
    // entirely — that was the actual bug: it left next month's Begin as
    // undefined instead of carrying forward whatever was already known,
    // forcing every uncounted item's starting count to be redone by hand.
    const next={};
    for(const it of state.catalog['TRIMARK'].items){
      const t=state.trimark[it.id]||{};
      const r=trimarkRow(t.begin,t.add,t.count,it.par,it.unitCost);
      next[it.id] = (r.counted!=null)
        ? {begin:r.counted, add:'', count:'', areas:{}}
        : {begin:t.begin||0, add:'', count:'', areas:{}};   // not counted — keep the prior Begin, don't lose it
    }
    state.trimark=next;
    persist('history'); persist('trimark'); render(); toast('Month saved · counts rolled forward','ok');
  }, 'Save month');
}

function openRecord(idx){
  const h=state.history[idx]; if(!h) return;
  const rows=(h.items||[]).filter(i=>(+i.orderQty||0)>0||i.count!=null||i.onHand!=null).map(i=>{
    const parts=[];
    if(i.count!=null) parts.push(`count ${i.count}`);
    if(i.used!=null) parts.push(`used ${i.used}`);
    if((+i.orderQty||0)>0) parts.push(`order ${i.orderQty}`);
    if(i.onHand!=null && i.count==null) parts.push(`on hand ${i.onHand}`);
    const detail = parts.length ? parts.join(' · ') : 'no quantity recorded';
    return `<div class="item"><div class="item-main">
      <div class="item-name">${esc(i.name)}</div>
      <div class="item-meta">${detail}</div></div></div>`;
  }).join('');
  const nothingOrdered = !rows;
  modal(`<h2>${esc(h.supplier)} — ${esc(h.type)}</h2>
    <div class="sched">${esc(h.date)}</div>${rows||
      '<div class="empty">No quantities were recorded on this save — likely a count with nothing entered, or an order sent with 0 items.</div>'}
    <div class="save-bar"><div class="btn-row">
      ${h.type==='order'?`<button class="btn" onclick="resendRecord(${idx})">↻ Re-send</button>`:''}
      ${(h.type==='inventory'&&h.supplier==='TRIMARK')?`<button class="btn" onclick="resendInventoryOrder(${idx})">↻ Re-send order</button>
        <button class="btn ghost" onclick="openMonthInInventory(${h.ts})">📅 Open &amp; edit counts</button>`:''}
      <button class="btn ghost" style="color:var(--crit)" onclick="deleteRecord(${idx})">🗑 Delete</button>
    </div></div>`);
}

// Jump straight from a saved record into the editable month view.

  setTab('inventory');
}
function deleteRecord(idx){

function resendRecord(idx){

/* ── Re-sending a saved Trimark month ──
   A saved inventory record stores orderQty in UNITS and carries no caseQty,
   so it can't just be handed to _sendFromItems — that would email raw units
   and undo the case-rounding fix. Instead we re-route through the same
   channel rules as a live send, looking each item's channel and case size
   up from the catalog by id. ── */
function inventoryRecordGroups(rec){
  const groups = { james:[], bek:[], email:{} };
  for(const rit of (rec.items||[])){
    const units = +rit.orderQty||0;
    if(units<=0) continue;
    const cat = state.catalog['TRIMARK'].items.find(c=>c.id===rit.id) || {};
    const ch = cat.orderChannel;
    if(ch==='text') continue;      // firewood: manual fixed reorder, not month-driven
    if(ch==='bek'){
      groups.bek.push({name:rit.name, itemNum:cat.itemNum||rit.itemNum||'', orderQty:units});
    } else if(ch==='email'){
      const key = cat.altEmail||'';
      (groups.email[key] = groups.email[key]||[]).push({
        name:rit.name, vendor:cat.altVendor||'',
        orderQty: unitsToCases(units, cat.caseQty), unitsNeeded: units, caseQty: cat.caseQty||null,
      });
    } else {
      groups.james.push({
        name:rit.name, itemNum:cat.itemNum||rit.itemNum||'',
        orderQty: unitsToCases(units, cat.caseQty), unitsNeeded: units, caseQty: cat.caseQty||null,
      });
    }
  }
  return groups;
}

function resendInventoryOrder(idx){
  const rec = state.history[idx];
  if(!rec) return;
  const g = inventoryRecordGroups(rec);
  const btns = [];
  if(g.james.length) btns.push(`<button class="btn" onclick="resendInventoryChannel(${idx},'james')">
    ✉️ Email James <span class="pill-count">${g.james.length}</span></button>`);
  if(g.bek.length) btns.push(`<button class="btn ghost" onclick="resendInventoryChannel(${idx},'bek')">
    📄 BEK CSV <span class="pill-count">${g.bek.length}</span></button>`);
  Object.entries(g.email).forEach(([email,items])=>{
    const vendor = items[0]?.vendor || 'other vendor';
    btns.push(`<button class="btn ghost" onclick="resendInventoryChannel(${idx},'email:${esc(email)}')">
      ✉️ Email ${esc(vendor)} <span class="pill-count">${items.length}</span></button>`);
  });

  if(!btns.length){
    modal(`<h2>Re-send ${esc(rec.date)}</h2>
      <div class="empty">Nothing was due to order in this saved month.</div>`);
    return;
  }
  modal(`<h2>Re-send ${esc(rec.date)}</h2>
    <div class="sched">Sends the same quantities this month recorded, in cases where the item is
      sold by the case. Firewood is left out — it's a manual reorder, not month-driven.</div>
    ${btns.join('')}`);
}

function resendInventoryChannel(idx, key){
  const rec = state.history[idx];
  if(!rec) return;
  const g = inventoryRecordGroups(rec);
  closeModal();
  if(key==='james'){
    if(!g.james.length){ toast('Nothing to send','warn'); return; }
    return sendEmail('TRIMARK', g.james);
  }
  if(key==='bek'){
    if(!g.bek.length){ toast('Nothing to send','warn'); return; }
    return downloadBekCsv(g.bek);
  }
  if(key.startsWith('email:')){
    const email = key.slice(6);
    const items = g.email[email]||[];
    if(!items.length){ toast('Nothing to send','warn'); return; }
    if(!email){ editChannelTarget('email'); return; }
    const vendor = items[0]?.vendor||'';
    const subject = `Bartlett's order — ${new Date().toLocaleDateString()}`;
    const body = `Hello${vendor?' '+vendor:''},\n\nPlease process the following order for Bartlett's:\n\n`+
      items.map(i=> (i.caseQty && i.caseQty>1)
        ? `${i.orderQty} case${i.orderQty!==1?'s':''} × ${i.name} (${i.caseQty}/cs, ${i.unitsNeeded} ct needed)`
        : `${i.orderQty} × ${i.name}`
      ).join('\n')+`\n\nThank you,\nBartlett's Restaurant`;
    openEmailChoice(email, subject, body);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   6. ORDER CHANNELS  (SMS / CSV / email — your exact formats)
   ═══════════════════════════════════════════════════════════════════ */
function sendOrder(sn){
  const isTrimarkInventory = (sn==='TRIMARK' && state.tab==='inventory');
  let items, rec = null;
  if(isTrimarkInventory){
    // Trimark's inventory count IS its durable record (saved separately via
    // "Save month & reset"), so a channel send here has nothing extra to
    // commit — it's just dispatching what the count already determined.
    items = state.catalog['TRIMARK'].items.map(it=>{
      const t=state.trimark[it.id]||{}; const r=trimarkRow(t.begin,t.add,t.count,it.par,it.unitCost);
      return {name:it.name,itemNum:it.itemNum||'',orderQty:r.order||0};
    }).filter(i=>i.orderQty>0);
  } else {
    rec = buildOrderRecord(sn);
    items = rec ? rec.items : [];
  }
  if(!items.length){ toast('No items with quantity to send','warn'); return; }
  // Tapping Send IS the commitment to place this order — record it now,
  // before triggering the actual dispatch, rather than relying on a
  // separate manual "Save" tap that's easy to forget. That gap was leaving
  // real holes in History/COGS: an order goes out, nothing gets recorded.
  // Doing this first (not after) also matches the skip-clear reasoning
  // below — anything that must reliably happen shouldn't be scheduled
  // after a call that might navigate the page.
  if(!isTrimarkInventory && clearSkipsForSupplier(sn)) render();
  if(rec){ commitOrderRecord(sn, rec); render(); }
  _sendFromItems(sn, items);
}

function _sendFromItems(sn, items){
  items = (items||[]).filter(i=>(+i.orderQty||0)>0);
  if(!items.length){ toast('No items to send','warn'); return; }
  if(sn==='ABCO')   return sendAbcoSms(items);
  if(sn==='BEK')    return downloadBekCsv(items);
  return sendEmail(sn, items);   // TRIMARK, AMAZON, ELECTRICAL
}

function sendAbcoSms(items){
  const lines = items.map(i=>`-x${i.orderQty} ${i.name}`);
  const groups=[]; for(let i=0;i<lines.length;i+=3) groups.push(lines.slice(i,i+3).join('\n'));
  const body=`Hi Hal, ABCO order:\n\n${groups.join('\n\n')}\n\nThanks`;
  window.location.href=`sms:5128015422&body=${encodeURIComponent(body)}`;
}

function downloadBekCsv(items){
  const rows=['Item#,Each,Quantity']; const missing=[];
  items.forEach(i=>{
    const num=getBekItemNum(i); const q=+i.orderQty||0;
    if(num && q>0) rows.push(`${num},Each,${q}`); else if(q>0) missing.push(i.name);
  });
  if(missing.length) toast(`⚠ ${missing.length} missing BEK#: ${missing.join(', ')}`,'warn');
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const d=new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}).replace(/\//g,'-');
  const a=document.createElement('a'); a.href=url; a.download=`BEK-order-${d}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('BEK CSV downloaded','ok');
}
function getBekItemNum(item){
  if(item.itemNum) return item.itemNum;
  const cat=state.catalog['BEK'].items;
  const byId=cat.find(c=>c.id===item.id); if(byId?.itemNum) return byId.itemNum;
  const byName=cat.find(c=>c.name===item.name); if(byName?.itemNum) return byName.itemNum;
  return '';
}

/* ── Sending an email: let the person choose HOW ──
   mailto: links always open whatever's set as the device's default mail
   app — a webpage can't force a specific third-party app like Outlook to
   open instead; that's an iOS restriction, not something in our control.
   The practical way around it: offer a plain-text copy, so someone can
   open Outlook themselves and paste in. This also sidesteps a real Apple
   Mail quirk — copying text OUT of Mail's compose window can carry hidden
   formatting (often an inherited white text color) that Outlook renders
   literally, making pasted text invisible. Copying straight from here,
   as plain text, never passes through Mail's rich-text layer at all. ── */
let _pendingEmail = null;
function openEmailChoice(to, subject, body){
  _pendingEmail = {to, subject, body};
  modal(`<h2>Send order</h2>
    <div class="sched">"Open in Mail" uses whatever your phone has set as the default mail app.
      Using Outlook or something else? Copy the text and paste it into a new email there instead —
      copied as plain text, so it won't have the invisible-formatting issue from copying out of Mail.</div>
    <div class="sched" style="margin-top:6px"><b>To:</b> ${esc(to)}<br><b>Subject:</b> ${esc(subject)}</div>
    <button class="btn" onclick="_sendPendingEmailViaMailto()">📧 Open in Mail app</button>
    <button class="btn ghost" onclick="_copyPendingEmailText()">📋 Copy order text</button>`);
}
function _sendPendingEmailViaMailto(){
  if(!_pendingEmail) return;
  const {to, subject, body} = _pendingEmail;
  closeModal();
  window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function _copyPendingEmailText(){
  if(!_pendingEmail) return;
  const {body} = _pendingEmail;
  const done = ()=>{ toast('Copied — paste into Outlook or any mail app','ok'); closeModal(); };
  const fail = ()=>{ toast('Could not copy — try "Open in Mail app" instead','warn'); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(body).then(done).catch(fail);
    } else {
      const ta = document.createElement('textarea');
      ta.value = body; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      ta.remove();
      ok ? done() : fail();
    }
  }catch(e){ fail(); }
}

function sendEmail(sn, items){
  const c=DEFAULT_SUPPLIERS[sn];
  const to = (c.contact.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[''])[0] || (c.email||'');
  const subject=`Bartlett's ${sn} order — ${new Date().toLocaleDateString()}`;
  const body=`Hello,\n\nPlease process the following order for Bartlett's:\n\n`+
    items.map(i=>{
      // Case-based items (Trimark → James / uniform vendor) carry caseQty:
      // say cases, not raw units, since that's what you actually order.
      if(i.caseQty && i.caseQty>1){
        return `${i.orderQty} case${i.orderQty!==1?'s':''} × ${i.name} (${i.caseQty}/cs, ${i.unitsNeeded} ct needed)${i.itemNum?` (#${i.itemNum})`:''}`;
      }
      return `${i.orderQty} × ${i.name}${i.itemNum?` (#${i.itemNum})`:''}`;
    }).join('\n')+
    `\n\nThank you,\nBartlett's Restaurant`;
  openEmailChoice(to, subject, body);
}
