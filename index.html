function modal(html){
  $('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><button class="close" onclick="closeModal()">×</button>${html}</div></div>`;
}
function closeModal(){ $('modal-root').innerHTML=''; }

// In-app confirmation (iOS PWAs can silently block native confirm()).
let _confirmCb=null;
function confirmModal(msg, onYes, yesLabel){
  _confirmCb=onYes;
  $('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)_confirmNo()">
    <div class="sheet" style="max-width:420px">
      <h2>Please confirm</h2>
      <div class="sched" style="font-size:15px;white-space:pre-line;margin-bottom:8px">${esc(msg)}</div>
      <button class="btn" onclick="_confirmYes()">${esc(yesLabel||'Yes, continue')}</button>
      <button class="btn ghost" onclick="_confirmNo()">Cancel</button>
    </div></div>`;
}
function _confirmYes(){ const cb=_confirmCb; _confirmCb=null; closeModal(); if(cb) cb(); }
function _confirmNo(){ _confirmCb=null; closeModal(); }
let _toastT=null;
function toast(msg,kind){
  clearTimeout(_toastT);
  const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:'');
  el.textContent=msg; document.body.appendChild(el);
  _toastT=setTimeout(()=>el.remove(),2600);
}

/* ═══════════════════════════════════════════════════════════════════
   8. FIREBASE SYNC  (echo-guarded — the crash fix)
   ═══════════════════════════════════════════════════════════════════ */
const FB_CONFIG = {
  apiKey:"AIzaSyDuL9lMcDJ1ydsH5Jn5B3socsNUScrby9c",
  authDomain:"bartletts-rest-op.firebaseapp.com",
  databaseURL:"https://bartletts-rest-op-default-rtdb.firebaseio.com",
  projectId:"bartletts-rest-op",
  storageBucket:"bartletts-rest-op.firebasestorage.app",
  messagingSenderId:"347944384568",
  appId:"1:347944384568:web:dc4417a68cc15d246d0ecd"
};
let _lastSyncError = '';
let _syncStatus = 'offline';   // survives render() — the badge is drawn from this
function setSync(status, detail){
  _syncStatus = status;
  if(status==='synced') _lastSyncError = '';   // a healthy connection must not keep showing an old problem
  else if(detail) _lastSyncError = detail;
  const el=$('sync'); if(!el) return;
  el.className='sync-badge '+status;
  el.querySelector('span:last-child').textContent=status;
}
function showSyncDetail(){
  const status = _syncStatus;
  const lines = [`Build: ${APP_VERSION}`, `Status: ${status}`];
  if(_lastSyncEvidence){
    const ago = Math.round((Date.now()-_lastSyncEvidence)/1000);
    lines.push(`Last confirmed sync: ${ago<60?ago+'s':Math.round(ago/60)+'m'} ago`);
  }
  if(_lastSyncError) lines.push(`Detail: ${_lastSyncError}`);
  // 'error' is NOT the same as 'offline': the connection can be fine while one
  // save or read is refused (rules, sign-in, a failed upgrade). Say which.
  const refused = /denied|permission/i.test(_lastSyncError);
  lines.push('', status==='synced'
    ? 'Connected. Changes save instantly and sync across devices.'
    : status==='syncing'
      ? 'Connecting…'
      : status==='error'
        ? 'This is a problem with a save, read or sign-in — not necessarily your wifi or connection. The Detail line above says what. Your work is saved on this device and nothing is lost.'
          + (refused ? ' "Denied" means the database settings (Firebase rules) refused it: that needs a settings fix, so tell Oscar the Detail line.' : '')
        : 'Not connected. Your work is still saved on this device — it will sync automatically once connected. If this persists, check wifi.');
  modal(`<h2>Sync status</h2><div class="sched" style="white-space:pre-line;font-size:14px">${esc(lines.join('\n'))}</div>
    ${status!=='synced' && lsGet('accountAuth') ? `<button class="btn" onclick="openLoginSheet()">Sign in</button>` : ''}
    ${status!=='synced' ? `<button class="btn${lsGet('accountAuth')?' ghost':''}" onclick="retryConnection()">↻ Retry connection</button>` : ''}
    <button class="btn ghost" onclick="closeModal()">Close</button>`);
}
// Force a fresh connection attempt: tear the socket down and bring it back up.
// Useful on flaky wifi or after a captive-portal/network change without reloading.
function retryConnection(){
  closeModal();
  if(!fbDb){ initFirebase(); toast('Reinitializing…','ok'); return; }
  try{
    setSync('syncing','Retrying connection…');
    firebase.database().goOffline();
    setTimeout(()=>{ firebase.database().goOnline(); }, 400);
    toast('Retrying connection…','ok');
  }catch(e){ setSync('error','Retry failed: '+(e.message||e)); }
}
let _listenersStarted = false;
function initFirebase(){
  if(typeof firebase==='undefined'){ setSync('error','Firebase SDK failed to load (check network/ad-blockers)'); setTimeout(initFirebase,1500); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fbDb=firebase.database();
    setSync('syncing');
    // Session-first: Firebase persists sign-ins across loads. If a user session
    // exists (account OR anonymous), use it. Otherwise: account-mode devices
    // wait for sign-in; default devices sign in anonymously (original behavior).
    firebase.auth().onAuthStateChanged(user=>{
      if(user){
        if(!_listenersStarted){ _listenersStarted=true; startListeners(); }
        return;
      }
      _listenersStarted=false;
      if(lsGet('accountAuth')){
        setSync('error','Signed out — tap this badge to sign in');
      } else {
        firebase.auth().signInAnonymously()
          .catch(e=>{ console.warn('auth',e); setSync('error','Auth failed: '+(e.code||e.message||e)); });
      }
    });
  }catch(e){ console.warn('fb init',e); setSync('error','Init failed: '+(e.message||e)); }
}

/* ── Account sign-in (optional security upgrade over anonymous auth) ── */
function openLoginSheet(){
  modal(`<h2>Sign in</h2>
    <div class="sched">One-time sign-in for this device. The session is remembered — no password is stored by the app.</div>
    <label class="fl">Email</label>
    <input class="field" type="email" id="login-email" autocomplete="username">
    <label class="fl">Password</label>
    <input class="field" type="password" id="login-pass" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Sign in</button>
    ${lsGet('accountAuth')?`<button class="btn ghost" onclick="disableAccountAuth()">Switch back to anonymous mode</button>`:''}`);
}
function doLogin(){
  const email=($('login-email')?.value||'').trim(), pass=$('login-pass')?.value||'';
  if(!email || !pass){ toast('Enter email and password','warn'); return; }
  if(typeof firebase==='undefined'){ toast('Still loading — try again in a moment','warn'); return; }
  setSync('syncing','Signing in…');
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then(()=>{ lsSet('accountAuth', true); closeModal(); toast('Signed in','ok'); })
    .catch(e=>{ setSync('error','Sign-in failed: '+(e.code||e.message||e)); toast('Sign-in failed — check email/password','warn'); });
}
function enableAccountAuth(){
  confirmModal('Switch this device to account sign-in?\n\nFirst create the account in Firebase console (Authentication → Add user) and update database rules — see the steps in Help → Security.', ()=>{
    try{ if(typeof firebase!=='undefined') firebase.auth().signOut().catch(()=>{}); }catch(e){}
    lsSet('accountAuth', true);
    openLoginSheet();
  }, 'Continue');
}
function disableAccountAuth(){
  lsSet('accountAuth', false);
  try{ if(typeof firebase!=='undefined') firebase.auth().signOut().catch(()=>{}); }catch(e){}
  closeModal();
  toast('Back to anonymous mode','ok');
}
function startListeners(){
  // Don't claim 'synced' yet — wait for the real .info/connected signal below.
  setSync('syncing', 'Authenticated, waiting for connection…');
  maybeMigrate();
  // Paths holding whatever Oscar just counted/entered: if a write from right
  // before the app closed or reloaded hadn't reached Firebase yet, the very
  // FIRST snapshot each listener gets on a fresh page load can still be the
  // old pre-edit value — isEchoing() can't catch this because _echoUntil is a
  // brand-new, empty object on this boot, so it offers no protection for an
  // edit made in a PREVIOUS session. Guarded here so a reload (iOS backgrounding
  // the PWA long enough to evict it, a force-quit, a low-battery relaunch —
  // all routine during a long walk-the-restaurant count) can't silently revert
  // a count back to old data the moment the app reconnects.
  // (trimark no longer needs this: it syncs per item with real stamps — see
  // bindTrimarkItems. The 24h window below stays for the two fields not yet converted.)
  const _reconcileOnBoot = new Set(['onHand','orderQty']);
  const _firstSnapshotSeen = {};
  // How long this device's own last edit is trusted over a conflicting first
  // snapshot. Generous enough to cover a whole offline overnight count, short
  // enough that a second device that's just sat open for days (e.g. a laptop
  // used only to glance at History) can't win a real conflict with it — that
  // device's local copy is simply old, not an unsynced edit, so it should
  // defer to whatever Firebase actually has.
  const RECONCILE_WINDOW_MS = 24*60*60*1000;
  const bind=(path, apply)=>{
    fbDb.ref(path).on('value', snap=>{
      _lastSyncEvidence=Date.now();          // receiving data = sync works
      if(isEchoing(path)) return;
      const val=snap.val();
      if(_reconcileOnBoot.has(path) && !_firstSnapshotSeen[path]){
        _firstSnapshotSeen[path]=true;
        const local=state[path];
        const localNonEmpty = local && typeof local==='object' && Object.keys(local).length>0;
        const editTs = lsGet(path+'__editTs') || 0;
        const editedRecently = (Date.now()-editTs) < RECONCILE_WINDOW_MS;
        if(localNonEmpty && editedRecently && JSON.stringify(val)!==JSON.stringify(local)){
          console.warn('[sync] first snapshot for', path, 'differs from a recent local edit — keeping local, re-pushing');
          pushRemote(path, local);
          return;
        }
      }
      if(val==null) return;
      apply(val); lsSet(path, val); render();
    }, err=>{ console.warn('listener error', path, err); setSync('error', `Read denied on "${path}": ${err.message||err}`); });
  };
  bind('deletedIds', v=>{ state.deletedIds=v; });
  bind('locations', v=>{ if(Array.isArray(v)&&v.length) state.locations=v; });
  bind('catalog',  v=>mergeCatalog(v));
  bind('orderQty', v=>{ state.orderQty=v; });
  bind('onHand',   v=>{ state.onHand=v; });
  bindTrimarkItems();
  fbDb.ref('meta/checkpoints').on('value', snap=>{ _ckptAll = snap.val() || {}; _ckptReadErr = false; ckptRefreshLabel(); },
    err=>{ console.warn('listener error meta/checkpoints', err); _ckptReadErr = true; ckptRefreshLabel(); });
  bind('cog',      v=>{ state.cog={sales:{},manual:{},...v}; });
  bind('learning', v=>{ state.learning=v; });
  bind('skipped',  v=>{ state.skipped=v; });
  bind('priceHistory', v=>{ state.priceHistory=v; });
  bind('expenses', v=>{ state.expenses = Array.isArray(v) ? v : []; });
  bind('history',  v=>{ if(Array.isArray(v)) state.history=v;
                        else if(v&&typeof v==='object') state.history=Object.values(v); });
  setTimeout(()=>{    // opened with no connection at all: the socket never reports again, so look once after the grace period
    if(!_fbConnected && Date.now()-Math.max(_lastSyncEvidence, _syncBootTs) > 15000)
      setSync('offline','Realtime connection dropped or never established.');
  }, 15500);
  fbDb.ref('.info/connected').on('value', s=>{
    _fbConnected = !!s.val();
    if(s.val()){ _lastSyncEvidence=Date.now(); setSync('synced'); return; }
    // Socket reports down — but if writes/reads succeeded very recently, the
    // socket is just flapping while data still flows. Don't cry wolf.
    if(Date.now()-Math.max(_lastSyncEvidence, _syncBootTs) > 15000)
      setSync('offline','Realtime connection dropped or never established.');
  });
}

// Read old v1 paths ONCE and migrate into v2 shapes — only if v2 is empty.
function maybeMigrate(){
  const alreadyMigrated = lsGet('migrated-v1-to-v2');
  if(alreadyMigrated) return;
  if(state.history.length || Object.keys(state.trimark).length){
    lsSet('migrated-v1-to-v2', true); return;   // v2 already has data; don't overwrite
  }
  const oldPaths=['catalog','history','trimarkBegin','trimarkAdd','trimarkTally','cogSales','cogManual','learning'];
  Promise.all(oldPaths.map(p=>fbDb.ref(p).once('value').then(s=>[p,s.val()]).catch(()=>[p,null])))
    .then(entries=>{
      const old={}; for(const [p,v] of entries) if(v!=null) old[p]=v;
      if(!Object.keys(old).length){ lsSet('migrated-v1-to-v2', true); return; }
      // SAFETY: back up the exact raw old-shape data to its own path BEFORE
      // converting, since 'catalog'/'history'/'learning' are shared path names
      // between old and new schemas — without this backup, the pre-migration
      // data would be gone the moment we write the converted version back.
      fbDb.ref('backup-pre-v2-migration').set({...old, backedUpAt:Date.now()});
      const did = migrateFromV1(old);
      if(did){
        ['catalog','history','trimark','cog','learning'].forEach(k=>persist(k));
        toast('Imported your existing data (backup saved)','ok');
      }
      lsSet('migrated-v1-to-v2', true);
      render();
    });
}

// Manual repair: re-run migration from the pre-migration backup we saved.
// Use this if the FIRST migration produced bad data (e.g. unformatted raw-ISO
// dates from an earlier version of this app) — it restores the untouched
// backup and re-converts it with the current (fixed) migration logic.
function repairFromBackup(){
  if(!fbDb){ toast('Not connected — try again once synced','warn'); return; }
  confirmModal('This checks for broken dates in your History and fixes them.\n\nIf a backup from your last sync exists, it re-imports from that. Otherwise it repairs the records currently loaded.', ()=>{
    fbDb.ref('backup-pre-v2-migration').once('value').then(snap=>{
      const old = snap.val();
      if(old){
        state.history = []; state.trimark = {}; state.cog = {sales:{},manual:{}}; state.learning = {};
        const did = migrateFromV1(old);
        if(did){
          ['catalog','history','trimark','cog','learning'].forEach(k=>persist(k));
          toast('Repaired from backup','ok');
        } else {
          toast('Backup was empty — nothing to restore','warn');
        }
        render();
        return;
      }
      // No backup exists (e.g. it predates this repair tool) — fix in place:
      // reformat any raw-ISO-string dates on the records already loaded.
      let fixed = 0;
      state.history = state.history.map(rec=>{
        if(/^\d{4}-\d{2}-\d{2}T/.test(rec.date)){
          const t = rec.ts || Date.parse(rec.date);
          fixed++;
          return {...rec, date: !isNaN(t)
            ? new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})
            : rec.date};
        }
        return rec;
      });
      if(fixed){ persist('history'); toast(`Fixed ${fixed} record date${fixed!==1?'s':''}`,'ok'); }
      else toast('No broken dates found — nothing to fix','ok');
      render();
    }).catch(e=>{ toast('Could not reach backup: '+(e.message||e),'warn'); });
  }, 'Repair now');
}
