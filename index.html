const SUP_NAMES = Object.keys(DEFAULT_SUPPLIERS);
/* ═══════════════════════════════════════════════════════════════════
   2. STATE + PERSISTENCE + SYNC
   Design: state = working copy. localStorage = cache. Firebase = truth.
   Every mutation: set state -> saveLocal(key) -> pushRemote(key).
   Echo guard stops the race conditions that crashed the old app.
   ═══════════════════════════════════════════════════════════════════ */

const LS_PREFIX = 'bartletts-v2-';

// The keys we persist + sync. Each is independent — no cross-key coupling.
const APP_VERSION = 'v3.3 — build 2026-10-25g';
const SYNC_KEYS = {
  catalog:   'catalog',    // per-supplier item list (par edits, custom items)
  deletedIds:'deletedIds', // tombstones: default items the user removed (per supplier)
  locations: 'locations',  // configurable storage locations for the tally
  orderQty:  'orderQty',   // {itemId: qty} current draft order
  onHand:    'onHand',     // {itemId: count} current on-hand entries
  trimark:   'trimark',    // {itemId:{begin,add,count,locs}} monthly inventory
  history:   'history',    // array of saved order/inventory records
  cog:       'cog',        // COGS: {sales:{}, manual:{}}
  learning:  'learning',   // recorded order patterns (data only; prediction optional)
  skipped:   'skipped',    // {itemId:true} "checked, no order needed" — clears on send
  priceHistory: 'priceHistory', // {itemId:[{ts,date,price,prevPrice,delta,deltaPct}]}
  expenses: 'expenses',    // [{id,date,ts,concept,amount}] — other spend, itemized
};

function defaultState(){
  const catalog = {};
  for (const sn of SUP_NAMES){
    catalog[sn] = { ...DEFAULT_SUPPLIERS[sn],
      items: DEFAULT_SUPPLIERS[sn].items.map(i => ({...i})) };
  }
  return {
    tab:'dashboard', activeSupp:'ABCO', editMode:false,
    catalog, deletedIds:{}, locations:['dock','closet','restaurant'],
    orderQty:{}, onHand:{}, trimark:{}, history:[],
    cog:{sales:{}, manual:{}}, learning:{}, skipped:{}, priceHistory:{}, expenses:[],
    countLog:[],   // append-only trail of trimark count entries — see logCountEntry()
  };
}

const state = defaultState();

/* ── localStorage helpers ── */
function lsGet(k){ try{ const v=localStorage.getItem(LS_PREFIX+k); return v?JSON.parse(v):null; }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); }catch{} }

/* ── Echo guard: after a local write, ignore remote echoes for this key ── */
const _echoUntil = {};                       // {key: timestamp}
function markLocalWrite(key){ _echoUntil[key] = Date.now() + 2000; }
function isEchoing(key){ return Date.now() < (_echoUntil[key]||0); }

/* ── Catalog merge: default is the schema, stored wins on editable fields.
      No inventoryOnly flag anywhere — items always render. ── */
function mergeCatalog(stored){
  if(!stored || typeof stored!=='object') return;
  const deleted = state.deletedIds || {};
  for(const sn of SUP_NAMES){
    const def = DEFAULT_SUPPLIERS[sn];
    const incoming = stored[sn]?.items;
    if(!Array.isArray(incoming)) continue;
    const tomb = new Set(deleted[sn]||[]);
    const byId = {};
    // Seed defaults (skip tombstoned) so itemNum/pack are present.
    for(const d of def.items){ if(!tomb.has(d.id)) byId[d.id] = {...d}; }
    // Overlay stored: stored wins on par/name/price; custom items (not in defaults) kept.
    for(const s of incoming){
      if(tomb.has(s.id)) continue;               // respect deletion
      const base = byId[s.id] || {};
      byId[s.id] = { ...base, ...s };
    }
    state.catalog[sn].items = Object.values(byId);
  }
}

/* ── Save one key locally + push to Firebase ── */
function persist(key){
  if(key==='trimark') return persistTrimark();   // per-item storage — see below
  const val = state[key];
  lsSet(SYNC_KEYS[key], val);
  // Persisted (survives reload) record of when THIS device last touched this
  // key — used only to settle the boot-time reconcile check below in favor of
  // whichever side was actually edited more recently, not just whichever
  // happens to be sitting in localStorage.
  lsSet(SYNC_KEYS[key] + '__editTs', Date.now());
  markLocalWrite(SYNC_KEYS[key]);
  pushRemote(SYNC_KEYS[key], val);
}

/* Firebase handle set later; no-op until connected. */
let fbDb = null;
let _lastSyncEvidence = 0;   // last server ack or snapshot — proof sync works
let _fbConnected = false;
let _syncBootTs = Date.now();  // when this page started: "offline" is only declared 15 s after the later of this and the last proof of sync
function pushRemote(path, val){
  if(!fbDb) return;
  try{
    trackWrite(fbDb.ref(path).set(val), path)
      .then(()=>{ _lastSyncEvidence=Date.now(); setSync('synced'); })
      .catch(e=>{ console.warn('push fail', path, e); setSync('error','Write denied on "'+path+'": '+(e.message||e)); });
  }catch(e){ console.warn('push fail', path, e); }
}

/* ── Append-only count log (Layer 3, part 1 of the sync-bulletproofing plan) ──
   A ground-truth trail of every trimark count entry, kept separate from the
   persist()/SYNC_KEYS system on purpose: persist() does a whole-object
   overwrite, which is correct for "current state" but wrong for a log — two
   devices logging around the same time must never be able to clobber each
   other's entries. Firebase push() solves that: every call gets its own
   unique, time-ordered key, so appends from different devices can never
   collide no matter the order they arrive in.
   Scope for this ship: trimark only, the field involved in the 2026-10-01
   incident — not yet the other ~11 synced fields. Same pattern extends to
   them when their turn in the rollout comes.
   Pure addition: nothing here is read by any other code yet, so this cannot
   change existing behavior. It exists so Layer 1's rebuild of trimark has a
   real recovery trail to build its sanity check against. */
function getDeviceId(){
  let id = lsGet('deviceId');
  if(!id){ id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); lsSet('deviceId', id); }
  return id;
}
function logCountEntry(itemId, row){
  // JSON round-trip drops undefined fields: Firebase rejects the whole write if
  // any field is undefined (a brand-new item has no begin/add yet).
  const entry = JSON.parse(JSON.stringify({
    itemId, ts: nowTs(), device: getDeviceId(),
    count: row.count, begin: row.begin, add: row.add, areas: row.areas,
  }));
  state.countLog.push(entry);
  lsSet('countLog', state.countLog);
  if(fbDb){
    try{
      trackWrite(fbDb.ref('countLog').push(entry), 'countLog').catch(e=>{
        console.warn('countLog push fail', e);
        setSync('error','Write denied on "countLog": '+(e.message||e));
      });
    }catch(e){ console.warn('countLog push fail', e); }
  }
}

/* ── Per-item trimark storage (Layer 1 of the sync-bulletproofing plan) ──
   Replaces whole-object sync of `trimark`. In Firebase each item is its own
   entry:  trimarkItems/{itemId} = {v: row, ts, dev}   (v absent = deleted; the
   tombstone stops a stale device from resurrecting a deleted item).
   Writes carry ONLY the items that changed, each stamped with the time and
   device; merging is per item, newest stamp wins. So two devices editing
   different items can't overwrite each other, and a stale device can't
   overwrite a newer value — the whole 2026-10-01 incident class, settled by
   one rule instead of the old 24h recency patch (retired for trimark).
   In memory nothing changes: state.trimark is still {itemId: row}, so every
   screen that reads it is untouched. persist('trimark') still works: it diffs
   state.trimark against what was last saved/applied and writes the
   difference, so no call site can forget to say which item it changed.
   The old whole-blob at Firebase path `trimark` is never read after migration
   and never written or deleted by this code — it stays as an inert backup. */
const TRI_PATH = 'trimarkItems';
const TRI_DAY = 24*60*60*1000;
let _srvOffset = +lsGet('srvOffset') || 0;   // Firebase server clock minus this device's clock
let _triMeta = {};                           // {itemId:{ts,dev}} last-write stamp per item
let _triBase = {};                           // {itemId: JSON of row as last saved/applied}
let _triMigrating = false;
function nowTs(){ return Date.now() + _srvOffset; }
function triClean(row){ return JSON.parse(JSON.stringify(row)); }
function triEnvelope(row, ts, dev){ return row==null ? {ts, dev} : {v: triClean(row), ts, dev}; }
// Is stamp a strictly newer than stamp b? Equal time: higher device id wins, so
// every device settles on the same answer instead of each keeping its own.
function triNewer(a, b){
  const at = +(a&&a.ts)||0, bt = +(b&&b.ts)||0;
  return at!==bt ? at>bt : String((a&&a.dev)||'')>String((b&&b.dev)||'');
}
// Order-independent form with empty containers dropped — how Firebase hands a row back.
function triCanon(v){
  if(v==null) return '';
  if(Array.isArray(v)) return v.length ? '['+v.map(triCanon).join(',')+']' : '';
  if(typeof v==='object'){
    const parts = Object.keys(v).sort().map(k=>{ const c=triCanon(v[k]); return c==='' ? '' : JSON.stringify(k)+':'+c; }).filter(Boolean);
    return parts.length ? '{'+parts.join(',')+'}' : '';
  }
  return JSON.stringify(v);
}
function triInitBase(){
  _triMeta = lsGet('trimarkMeta') || {};
  _triBase = {};
  for(const id of Object.keys(state.trimark)) _triBase[id] = JSON.stringify(state.trimark[id]);
}
function triSaveLocal(){ lsSet(SYNC_KEYS.trimark, state.trimark); lsSet('trimarkMeta', _triMeta); }
function pushTriItems(changed){
  if(!fbDb) return;
  try{
    trackWrite(fbDb.ref(TRI_PATH).update(changed), TRI_PATH)
      .then(()=>{ _lastSyncEvidence=Date.now(); setSync('synced'); })
      .catch(e=>{ console.warn('push fail', TRI_PATH, e); setSync('error','Write denied on "'+TRI_PATH+'": '+(e.message||e)); });
  }catch(e){ console.warn('push fail', TRI_PATH, e); }
}
function persistTrimark(){
  const ts = nowTs(), dev = getDeviceId(), changed = {};
  for(const id of new Set([...Object.keys(state.trimark), ...Object.keys(_triMeta)])){
    const row = state.trimark[id];
    const json = row==null ? null : JSON.stringify(row);
    if(json === (_triBase[id] ?? null)) continue;          // untouched since last save
    // Always strictly later than this item's previous stamp, so a clock that
    // stalls or steps backwards can never make a new edit look older than the
    // one before it (which would let the older value win and overwrite it).
    const t = Math.max(ts, (+(_triMeta[id] && _triMeta[id].ts) || 0) + 1);
    _triMeta[id] = {ts:t, dev};
    _triBase[id] = json;
    changed[id] = triEnvelope(row, t, dev);
  }
  triSaveLocal();
  // Until this device has joined per-item storage (see triMigrate/triFirstSync)
  // nothing is pushed — those edits ride along in the migration instead, so a
  // half-filled trimarkItems can never look like "already migrated".
  if(Object.keys(changed).length){
    if(lsGet('trimarkMigrated')) pushTriItems(changed);
    else if(fbDb) triMigrate();       // nothing existed to migrate before — this first edit starts it
  }
}
// Merge Firebase's per-item entries into this device, newest stamp wins.
function triReconcile(remote){
  const toPush = {}; let applied = false;
  for(const id of new Set([...Object.keys(remote), ...Object.keys(_triMeta)])){
    const r = remote[id], l = _triMeta[id];
    if(r && triNewer(r, l)){                               // theirs is newer: take it
      if(r.v != null) state.trimark[id] = r.v; else delete state.trimark[id];
      _triMeta[id] = {ts:+r.ts||0, dev:r.dev||''};
      _triBase[id] = r.v != null ? JSON.stringify(r.v) : null;
      applied = true;
    } else if(l && triNewer(l, r)){                        // ours is newer, or they never had it: send ours
      toPush[id] = triEnvelope(state.trimark[id], l.ts, l.dev);
    }
  }
  if(applied){ triSaveLocal(); render(); }
  if(Object.keys(toPush).length) pushTriItems(toPush);
}
// First contact for a device that already has old-format data when per-item
// data exists in Firebase. A recent local edit that Firebase doesn't have is
// kept (stamped now, so it wins and gets sent); anything older is just a stale
// copy and yields to Firebase.
function triFirstSync(remote){
  const recent = (Date.now() - (lsGet('trimark__editTs')||0)) < TRI_DAY;
  const ts = nowTs(), dev = getDeviceId();
  for(const id of Object.keys(state.trimark)){
    const r = remote[id], row = state.trimark[id];
    // Firebase has no entry: keep ours and send it — never silently drop a row
    // (if it belongs to a deleted item it is invisible and the next month
    // rollover clears it). Firebase has a LIVE entry that differs: ours wins only
    // if it is a recent edit. A tombstone, or an older copy, yields to Firebase.
    const mine = recent || id in _triMeta;
    const same = r && r.v!=null && triCanon(r.v)===triCanon(row);
    if(!r || (mine && r.v!=null && !same)) _triMeta[id] = {ts:Math.max(ts, (+(r&&r.ts)||0)+1), dev};   // must outrank what Firebase holds
  }
  triSaveLocal();
}
// One-time move of the old whole-blob into per-item entries. Runs on the first
// device that finds trimarkItems empty; the transaction makes "only if empty"
// atomic, so two devices starting together can't both seed it. A device's own
// recent edits win over the blob (they were never synced); everything else
// comes from the blob. The old blob itself is only read.
function triMigrate(){
  if(_triMigrating || lsGet('trimarkMigrated')) return;
  _triMigrating = true;
  const fail = e=>{ _triMigrating=false; console.warn('trimark migration failed', e); setSync('error','Inventory storage upgrade failed: '+(e.message||e)); };
  fbDb.ref('trimark').once('value').then(snap=>{
    const old = snap.val() || {};
    const recent = (Date.now() - (lsGet('trimark__editTs')||0)) < TRI_DAY;
    let seed = {}, ts = 0, dev = '';
    return fbDb.ref(TRI_PATH).transaction(cur=>{
      if(cur) return;                                      // already migrated elsewhere — abort
      seed = {}; ts = nowTs(); dev = getDeviceId();
      const items = {};
      for(const id of new Set([...Object.keys(old), ...Object.keys(state.trimark)])){
        const local = state.trimark[id];
        seed[id] = (local!=null && (old[id]==null || id in _triMeta || recent)) ? local : old[id];
        items[id] = triEnvelope(seed[id], ts, dev);
      }
      return Object.keys(items).length ? items : undefined;
    }, undefined, false).then(res=>{
      _triMigrating = false;
      if(!res.committed) return;                           // nothing to move, or someone else did it
      state.trimark = seed; _triMeta = {}; _triBase = {};
      for(const id of Object.keys(seed)){ _triMeta[id] = {ts, dev}; _triBase[id] = JSON.stringify(seed[id]); }
      triSaveLocal(); lsSet('trimarkMigrated', true);
      fbDb.ref('meta/trimarkMigration').set({at:ts, by:dev, items:Object.keys(seed).length}).catch(()=>{});
      render(); toast('Inventory storage upgraded','ok');
    });
  }).catch(fail);
}
function bindTrimarkItems(){
  fbDb.ref('.info/serverTimeOffset').on('value', s=>{ _srvOffset = +s.val()||0; lsSet('srvOffset', _srvOffset); });
  fbDb.ref(TRI_PATH).on('value', snap=>{
    _lastSyncEvidence = Date.now();
    const remote = snap.val();
    if(remote){
      if(!lsGet('trimarkMigrated')){ triFirstSync(remote); lsSet('trimarkMigrated', true); }
      triReconcile(remote);
    } else if(lsGet('trimarkMigrated')) triReconcile({});  // node was emptied: re-send what we hold
    else triMigrate();
  }, err=>{ console.warn('listener error', TRI_PATH, err); setSync('error', `Read denied on "${TRI_PATH}": ${err.message||err}`); });
}

/* ── Checkpoint (Layer 2 of the sync-bulletproofing plan) ──
   A deliberate "I'm about to switch devices" button for the Trimark counts.
   Firebase applies one connection's writes in the order they were sent, so
   when a probe write sent AFTER everything else is acknowledged, everything
   before it has reached the server too. The server's copy of every Trimark
   item is then read back and compared with this device's (this mostly
   re-confirms the acknowledgements, but it also catches a refused or
   reverted write). Only after all of that is the public "checkpoint" marker
   written, so no device ever shows a checkpoint that was not fully proven.
   Anything unconfirmed is reported instead of claiming safety. A checkpoint
   never edits counts; the only thing it may send again is an item the
   server lacks, with that item's ORIGINAL stamp (idempotent).
   Scope: Trimark counts. Other fields are only watched through the
   in-flight / refused-write counters. */
let _inflight = 0;          // writes sent but not yet acknowledged
let _failedPaths = {};      // {path: reason} while that path's most recent write was refused (a later success clears it)
let _logFailed = 0;         // count-log entries the server refused (a backup trail, not live data — reported, never blocking)
let _ckptLogBase = 0;       // _logFailed as of the last good checkpoint
let _ckptWaitMs = 10000;
let _ckptRunning = false;
let _ckptAll = {};          // {deviceId: {ts, device, build}} confirmed checkpoints from meta/checkpoints
let _ckptOwn = null;        // {ts} this device's last FULLY proven checkpoint (the server copy of it can echo before it is acknowledged)
let _ckptReadErr = false;
function trackWrite(p, label){
  _inflight++;
  return p.then(v=>{ _inflight--; delete _failedPaths[label]; return v; },
                e=>{ _inflight--; if(label==='countLog') _logFailed++; else _failedPaths[label] = String((e && e.message) || e); throw e; });
}
function ckptTimeout(ms){ return new Promise(res=>setTimeout(()=>res('timeout'), ms)); }
async function runCheckpoint(){
  const out = {ok:false, problems:[], items:0, logLost:0};
  const bad = t=>{ out.problems.push(t); return out; };
  const plural = (n, w)=> n+' '+w+(n===1?'':'s');
  const waiting = ()=> plural(_inflight,'change')+' still uploading. Stay on wifi and try again.';
  if(!fbDb) return bad('This device is not connected to the server.');
  if(!lsGet('trimarkMigrated'))
    return bad('This device has not finished joining the shared inventory yet. Stay on wifi with the app open for a minute, then try again.');
  persistTrimark();                              // flush anything not yet sent (sends only what changed)
  const dev = getDeviceId();
  // 1. Probe: acknowledged only after every earlier write on this connection.
  const probe = fbDb.ref('meta/checkpointProbes/'+dev).set({ts: nowTs()}).then(()=>'ok', e=>'refused:'+(e.message||e));
  const res = await Promise.race([probe, ckptTimeout(_ckptWaitMs)]);
  if(res==='timeout')
    return bad(plural(_inflight,'change')+' still waiting to upload. This usually means weak or no wifi. Stay on wifi and try again.');
  if(res!=='ok') return bad('The server refused a save ('+res.slice(8)+'). Tell Oscar before you switch devices.');
  if(_inflight>0) return bad(waiting());
  // 2. Read the server's copy back and compare, item by item.
  const triRef = fbDb.ref(TRI_PATH);
  const snap = await Promise.race([(triRef.get ? triRef.get() : triRef.once('value')).catch(()=>'timeout'), ckptTimeout(_ckptWaitMs)]);
  if(snap==='timeout') return bad('Could not read the server back to confirm. Stay on wifi and try again.');
  if(_inflight>0) return bad(waiting());           // something was sent while we were reading back
  const remote = snap.val() || {};
  let behind = 0, count = 0;
  const resend = {};   // items the server lacks or holds older: sent again with their ORIGINAL stamps (idempotent)
  for(const id of new Set([...Object.keys(state.trimark), ...Object.keys(_triMeta)])){
    const m = _triMeta[id], r = remote[id];
    if(state.trimark[id]!=null) count++;
    const missing = !r && state.trimark[id]!=null, older = !!(r && m && triNewer(m, r));
    if(missing || older){ behind++; if(m) resend[id] = triEnvelope(state.trimark[id], m.ts, m.dev); }
  }
  if(behind){
    const refused = _failedPaths[TRI_PATH];
    if(Object.keys(resend).length) pushTriItems(resend);
    return bad(refused
      ? 'The server refused the save of '+plural(behind,'item')+' ('+refused+'). Tell Oscar before you switch devices.'
      : plural(behind,'item')+' on this device '+(behind===1?'was':'were')+' newer than what the server had. They were sent again just now — tap "Check again".');
  }
  delete _failedPaths[TRI_PATH];                   // the server holds everything we hold: an old refusal no longer matters
  // 3. Any other field whose latest save was refused is still unconfirmed.
  const failed = Object.keys(_failedPaths);
  if(failed.length)
    return bad('The server refused the latest save of '+failed.map(f=>'"'+f+'" ('+_failedPaths[f]+')').join(', ')+'. Tell Oscar before you switch devices.');
  // 4. Only now publish the checkpoint, and wait for it to be acknowledged too.
  const ts = nowTs();
  const fin = fbDb.ref('meta/checkpoints/'+dev).set({ts, device:dev, build:APP_VERSION}).then(()=>'ok', e=>'refused:'+(e.message||e));
  const res2 = await Promise.race([fin, ckptTimeout(_ckptWaitMs)]);
  if(res2==='timeout') return bad('Could not finish recording the checkpoint. Stay on wifi and try again.');
  if(res2!=='ok') return bad('The server refused a save ('+res2.slice(8)+'). Tell Oscar before you switch devices.');
  if(_inflight>0) return bad(waiting());
  out.logLost = _logFailed - _ckptLogBase; _ckptLogBase = _logFailed;
  _ckptOwn = {ts};
  out.ok = true; out.items = count;
  return out;
}
function ckptLatest(){
  let best = _ckptOwn ? {ts:_ckptOwn.ts, key:getDeviceId()} : null;
  for(const k of Object.keys(_ckptAll||{})){
    if(k===getDeviceId()) continue;                // our own entry comes from _ckptOwn only (the server echo can precede its acknowledgement)
    const v = _ckptAll[k]; if(v && v.ts && (!best || v.ts>best.ts)) best = {...v, key:k};
  }
  return best;
}
function ckptLabel(){
  if(_ckptReadErr) return 'Checkpoint history unavailable (database settings)';
  const b = ckptLatest();
  if(!b) return 'No checkpoint yet';
  const mins = Math.max(0, Math.round((nowTs()-b.ts)/60000));
  const ago = mins<1 ? 'just now' : mins<60 ? mins+' min ago' : mins<1440 ? Math.round(mins/60)+' h ago' : Math.round(mins/1440)+' d ago';
  return 'Last checkpoint: '+ago+' · '+(b.key===getDeviceId() ? 'this device' : 'another device');
}
function ckptRefreshLabel(){ const el = $('ckpt-last'); if(el) el.textContent = ckptLabel(); }
setInterval(ckptRefreshLabel, 30000);   // keeps "2 min ago" honest while the screen stays open
async function checkpointTap(){
  if(_ckptRunning) return;
  _ckptRunning = true;
  const token = 'ckpt-'+Date.now();
  modal(`<h2 data-ckpt="${token}">Checkpoint</h2><div class="sched">Checking that everything on this device has reached the server… keep this screen open and stay on wifi.</div>`);
  let r;
  try{ r = await runCheckpoint(); }
  catch(e){ r = {ok:false, problems:['Something went wrong while checking ('+(e.message||e)+'). Tell Oscar before you switch devices.']}; }
  _ckptRunning = false;
  ckptRefreshLabel();
  // If the person closed the "Checking…" box and opened something else (a count sheet, say), never replace it.
  if(!document.querySelector('[data-ckpt="'+token+'"]')){
    toast(r.ok ? '✓ Checkpoint confirmed — safe to switch devices' : '⚠ Checkpoint did not confirm — open Checkpoint to see why', r.ok ? 'ok' : 'warn');
    return;
  }
  modal(r.ok
    ? `<h2 style="color:var(--ok)">✓ Safe to switch devices</h2>
       <div class="sched">All Trimark counts on this device are confirmed on the server — ${r.items} item${r.items===1?'':'s'} checked against the server's copy.</div>
       ${r.logLost>0 ? `<div class="sched" style="color:var(--low)">Note: ${r.logLost} count-log entr${r.logLost===1?'y':'ies'} could not be saved to the backup trail. Your counts are fine — tell Oscar.</div>` : ''}
       <button class="btn" onclick="closeModal()">Done</button>`
    : `<h2 style="color:var(--crit)">⚠ Don't switch devices yet</h2>
       <div class="sched">${r.problems.map(esc).join('<br><br>')}</div>
       <div class="sched">Your work is still saved on this device. Nothing is lost.</div>
       <button class="btn" onclick="checkpointTap()">↻ Check again</button>
       <button class="btn ghost" onclick="closeModal()">Close</button>`);
}

/* ── Load everything from localStorage on boot ── */
function loadLocal(){
  const del = lsGet(SYNC_KEYS.deletedIds); if(del) state.deletedIds = del;
  const loc = lsGet(SYNC_KEYS.locations); if(Array.isArray(loc)&&loc.length) state.locations = loc;
  const cat = lsGet(SYNC_KEYS.catalog);   if(cat) mergeCatalog(cat);
  const oq  = lsGet(SYNC_KEYS.orderQty);  if(oq)  state.orderQty = oq;
  const oh  = lsGet(SYNC_KEYS.onHand);    if(oh)  state.onHand   = oh;
  const tm  = lsGet(SYNC_KEYS.trimark);   if(tm)  state.trimark  = tm;
  triInitBase();
  const h   = lsGet(SYNC_KEYS.history);   if(Array.isArray(h)) state.history = h;
  const cog = lsGet(SYNC_KEYS.cog);       if(cog) state.cog = {sales:{},manual:{},...cog};
  const lrn = lsGet(SYNC_KEYS.learning);  if(lrn) state.learning = lrn;
  const sk  = lsGet(SYNC_KEYS.skipped);   if(sk)  state.skipped  = sk;
  const ph  = lsGet(SYNC_KEYS.priceHistory); if(ph) state.priceHistory = ph;
  const ex  = lsGet(SYNC_KEYS.expenses);   if(ex)  state.expenses = ex;
  const cl  = lsGet('countLog');           if(Array.isArray(cl)) state.countLog = cl;
}

/* ═══════════════════════════════════════════════════════════════════
   MIGRATION  (read old v1 data → new v2 shape, non-destructive)
   Old app split TRIMARK into trimarkBegin/trimarkAdd/trimarkTally and
   stored history with a `suppliers` object. We map those into v2 shapes.
   Runs only if v2 has no data yet, so it never clobbers newer edits.
   ═══════════════════════════════════════════════════════════════════ */

function migrateFromV1(old){
  if(!old || typeof old!=='object') return false;
  let did = false;

  if(old.catalog){ mergeCatalog(old.catalog); did=true; }

  if(Array.isArray(old.history) && !state.history.length){
    const flat=[];
    for(const rec of old.history){
      // Reformat whatever date shape the old record has into a readable string.
      // Old app stored raw ISO strings (new Date().toISOString()); render those
      // the same way we render every other date so History reads consistently.
      const tsVal = rec.ts || Date.parse(rec.date);
      const niceDate = !isNaN(tsVal)
        ? new Date(tsVal).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})
        : (rec.date || 'Unknown date');

      if(rec.items && rec.supplier){
        flat.push({...rec, date:niceDate, ts: rec.ts || tsVal || Date.now()});
        continue;
      }
      const supps = rec.suppliers||{};
      for(const sn of Object.keys(supps)){
        const items=(supps[sn]||[]).map(i=>({id:i.id,name:i.name,itemNum:i.itemNum||'',
          orderQty:+i.orderQty||0, unitCost:i.unitCost, count:i.count, used:i.used,
          onHand: i.onHand!=null && i.onHand!=='' ? +i.onHand : null}));
        flat.push({date:niceDate, ts: tsVal || Date.now(),
          supplier:sn, type:rec.type|| (sn==='TRIMARK'?'inventory':'order'), items});
      }
    }
    if(flat.length){ state.history=flat; did=true; }
  }

  if((old.trimarkBegin||old.trimarkAdd||old.trimarkTally) && !Object.keys(state.trimark).length){
    const b=old.trimarkBegin||{}, a=old.trimarkAdd||{}, tally=old.trimarkTally||{};
    const ids=new Set([...Object.keys(b),...Object.keys(a),...Object.keys(tally)]);
    for(const id of ids){
      const entry={};
      if(b[id]!=null) entry.begin=b[id];
      if(a[id]!=null) entry.add=a[id];
      const tv=tally[id];
      if(tv && typeof tv==='object'){
        entry.locs={dock:+tv.dock||0, closet:+tv.closet||0, restaurant:+tv.restaurant||0};
        entry.areas={};
        if(+tv.dock)       entry.areas.dock=[+tv.dock];
        if(+tv.closet)     entry.areas.closet=[+tv.closet];
        if(+tv.restaurant) entry.areas.restaurant=[+tv.restaurant];
        entry.count = (entry.locs.dock+entry.locs.closet+entry.locs.restaurant)||'';
      }
      state.trimark[id]=entry;
    }
    did=true;
  }

  if((old.cogSales||old.cogManual) && !Object.keys(state.cog.sales).length && !Object.keys(state.cog.manual).length){
    state.cog = { sales: old.cogSales||{}, manual: old.cogManual||{} };
    did=true;
  }

  if(old.learning && !Object.keys(state.learning).length){ state.learning=old.learning; did=true; }

  return did;
}

/* ═══════════════════════════════════════════════════════════════════
   3. PURE MATH  (no DOM, no state — fully testable)
   ═══════════════════════════════════════════════════════════════════ */

// Order need for a normal supplier: how many packs to reach par.
function orderNeed(par, onHand){
  const p = parseFloat(par), h = parseFloat(onHand);
  if(isNaN(p)) return 0;
  if(onHand==='' || onHand==null || isNaN(h)) return 0;   // uncounted -> suggest nothing
  return Math.max(0, p - h);
}

// Stock status for row colouring.
function stockStatus(onHand, par){
  const h=parseFloat(onHand), p=parseFloat(par);
  if(onHand==='' || onHand==null || isNaN(h)) return null;
  if(h<=0) return 'crit';
  if(!isNaN(p) && h<p) return 'low';
  return 'ok';
}

// TRIMARK inventory math. START = BEGIN + ADD. USED = START - COUNT.
// ORDER = max(0, PAR - COUNT).  (COUNT is the true end-of-month on-hand.)
function trimarkRow(begin, add, count, par, unitCost){
  const b=+begin||0, a=+add||0;
  const start = b + a;
  const counted = (count===''||count==null||isNaN(+count)) ? null : +count;
  const used  = counted==null ? null : start - counted;
  const order = counted==null ? null : Math.max(0, (+par||0) - counted);
  // Breakage $ = the Start→Count gap valued at unit cost. A negative gap
  // (counted MORE than start — likely a miscount or unlogged delivery)
  // is not a dollar loss, so it floors at 0 rather than showing a "gain".
  const cost = (+unitCost)||0;
  const breakageQty = used==null ? null : Math.max(0, used);
  const breakageValue = (used==null || !cost) ? null : +(breakageQty*cost).toFixed(2);
  return { start, used, order, counted, breakageQty, breakageValue };
}

// Month key from a date-ish value: 'YYYY-MM'.
function monthKey(dateVal){
  const d = (dateVal instanceof Date) ? dateVal : new Date(dateVal);
  if(isNaN(d)) return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// COGS spend DERIVED FROM SAVED ORDERS for a given month.
// Sums orderQty × unitCost across every history record dated in that month.
// unitCost comes from the saved line, else the current catalog item.
function cogSpendFromOrders(history, catalog, mk){
  const spend = {}; for(const sn of SUP_NAMES) spend[sn]=0;
  let total = 0;
  for(const rec of (history||[])){
    if(monthKey(rec.ts||rec.date) !== mk) continue;
    const sn = rec.supplier;
    for(const it of (rec.items||[])){
      const qty = +it.orderQty||0; if(qty<=0) continue;
      let cost = it.unitCost;
      if(cost==null && catalog && catalog[sn]){
        const ci = catalog[sn].items.find(c=>c.id===it.id || c.name===it.name);
        cost = ci ? ci.unitCost : null;
      }
      cost = +cost||0;
      if(cost>0){ const line = qty*cost; spend[sn]=(spend[sn]||0)+line; total+=line; }
    }
  }
  return { bySupplier:spend, total };
}

// Record a saved order into the learning store (data only — no prediction here).
function recordLearning(learning, rec){
  const out = {...(learning||{})};
  const wom = (()=>{ const d=new Date(rec.ts||rec.date); return isNaN(d)?0:Math.floor((d.getDate()-1)/7); })();
  const dow = (()=>{ const d=new Date(rec.ts||rec.date); return isNaN(d)?0:d.getDay(); })();
  for(const it of (rec.items||[])){
    const qty=+it.orderQty||0; if(qty<=0) continue;
    const k = rec.supplier+'|'+it.name;
    if(!out[k]) out[k]={supplier:rec.supplier, name:it.name, orders:[]};
    out[k].orders.push({ qty, dow, wom, ts: rec.ts||Date.now() });
    if(out[k].orders.length>60) out[k].orders = out[k].orders.slice(-60); // cap growth
  }
  return out;
}

// Export for Node testing
/* ═══════════════════════════════════════════════════════════════════
   MULTI-LOCATION TALLY
   The same item can be stored in several places (dock, closet, restaurant…).
   You count each location; the tally sums them into the item's Count.
   Locations are configurable (state.locations), default dock/closet/restaurant.
   Per-item location counts live in state.trimark[id].locs = {locName: n}.
   ═══════════════════════════════════════════════════════════════════ */

const DEFAULT_LOCATIONS = ['dock','closet','restaurant'];

function getLocations(){
  const l = state.locations;
  return (Array.isArray(l) && l.length) ? l : DEFAULT_LOCATIONS;
}

// ── Area-based tally ──────────────────────────────────────────────
// An item's count is organized by area; each area holds a list of entries.
// shape: areas = { dock:[22], restaurant:[30,24], closet:[] }
// Subtotal per area = sum of its entries. Total = sum of all entries.
// An area with zero entries is "not counted yet"; an area with entries
// (including a single 0) is counted.

// Push one more count onto an item's area — the actual mechanism behind
// the "+" button. Field stays empty and ready for the next number rather
// than ever pre-filling with what's already saved, so tapping + can never
// accidentally re-submit (and double-count) an old value.
function pushAreaEntry(itemId, area, rawValue){
  const v = String(rawValue).trim();
  if(v==='' || isNaN(+v)) return false;
  const t = state.trimark[itemId] || {};
  if(!t.areas || typeof t.areas!=='object') t.areas = {};
  if(!Array.isArray(t.areas[area])) t.areas[area] = [];
  t.areas[area].push(+v);
  t.locs = areasToLocs(t.areas);           // back-compat mirror, same as countSave()
  const total = areasTotal(t.areas);
  t.count = total==null ? '' : total;
  state.trimark[itemId] = t;
  persist('trimark');
  logCountEntry(itemId, t);
  return true;
}

function areaSubtotal(entries){
  if(!Array.isArray(entries) || !entries.length) return null;
  return entries.reduce((s,v)=> s + (+v||0), 0);
}

function areasTotal(areas){
  if(!areas || typeof areas!=='object') return null;
  let any=false, sum=0;
  for(const k of Object.keys(areas)){
    const st = areaSubtotal(areas[k]);
    if(st!=null){ any=true; sum+=st; }
  }
  return any ? sum : null;
}

// Which configured areas have no entries yet (the "did you forget?" list).
function uncountedAreas(locOrder, areas){
  const out=[];
  for(const loc of locOrder){
    const st = areaSubtotal(areas && areas[loc]);
    if(st==null) out.push(loc);
  }
  return out;
}

function analyzeAreas(locOrder, areas){
  const counted=[], blank=[];
  for(const loc of locOrder){
    (areaSubtotal(areas && areas[loc])==null ? blank : counted).push(loc);
  }
  return { counted, blank, total: areasTotal(areas),
    allBlank: counted.length===0, anyBlank: blank.length>0 };
}

// Back-compat: derive a flat {loc:subtotal} for anything still reading .locs
function areasToLocs(areas){
  const out={};
  if(areas) for(const k of Object.keys(areas)){
    const st=areaSubtotal(areas[k]); out[k]= st==null?'':st;
  }
  return out;
}
/* ═══════════════════════════════════════════════════════════════════
   REPORTS  — date-range lookback across History, with noise-cutting filters.
   Pure aggregation: given history + a filter spec, produce a per-item
   summary (not a raw dump of every record) so past holidays are readable.
   ═══════════════════════════════════════════════════════════════════ */

// Default filter spec.
function defaultReportFilter(){
  const now = new Date();
  // "This month + all of last month" rather than a narrow trailing window —
  // Trimark inventory saves monthly, so a 7-day default made a
  // freshly-saved-or-corrected month invisible by default: not because
  // anything was broken, but because it simply wasn't in view. This is
  // wide enough to always include the most recently closed month,
  // regardless of what day of the current month it is.
  const start = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return {
    start: isoDate(start), end: isoDate(now),
    suppliers: 'all',        // 'all' or array of supplier names
    types: 'all',            // 'all' | 'order' | 'inventory'
    activeOnly: true,        // hide items with zero quantity across the range
    search: '',              // item-name substring filter
  };
}
function isoDate(d){ return d.toISOString().slice(0,10); }

// Quick-range presets, computed relative to "now".
function reportPreset(key, now){
  now = now || new Date();
  const d = (n)=>{ const x=new Date(now); x.setDate(x.getDate()+n); return x; };
  const startOfWeekLastYear = (weeksAgoYears)=>{
    const x=new Date(now); x.setFullYear(x.getFullYear()-1); return x;
  };
  switch(key){
    case '7d':  return { start: isoDate(d(-7)),  end: isoDate(now) };
    case '30d': return { start: isoDate(d(-30)), end: isoDate(now) };
    case 'month': {
      const s=new Date(now.getFullYear(), now.getMonth(), 1);
      return { start: isoDate(s), end: isoDate(now) };
    }
    case 'lastmonth': {
      const s=new Date(now.getFullYear(), now.getMonth()-1, 1);
      const e=new Date(now.getFullYear(), now.getMonth(), 0);   // last day of last month
      return { start: isoDate(s), end: isoDate(e) };
    }
    case 'lastyear-week': {
      // Same week, one year ago: 3 days before/after today's date last year.
      const ly = new Date(now); ly.setFullYear(ly.getFullYear()-1);
      const s = new Date(ly); s.setDate(s.getDate()-3);
      const e = new Date(ly); e.setDate(e.getDate()+3);
      return { start: isoDate(s), end: isoDate(e) };
    }
    case 'lastyear-month': {
      const ly = new Date(now); ly.setFullYear(ly.getFullYear()-1);
      const s = new Date(ly.getFullYear(), ly.getMonth(), 1);
      const e = new Date(ly.getFullYear(), ly.getMonth()+1, 0);
      return { start: isoDate(s), end: isoDate(e) };
    }
    default: return defaultReportFilter();
  }
}

// Is a history record's date within [start,end] (inclusive, by day)?
function inRange(rec, start, end){
  const t = rec.ts || Date.parse(rec.date);
  if(!t || isNaN(t)) return false;
  const day = new Date(t); day.setHours(12,0,0,0); // normalize to avoid TZ edge issues
  const s = new Date(start+'T00:00:00');
  const e = new Date(end+'T23:59:59');
  return day >= s && day <= e;
}

// Map of item -> where it sits in the catalog, i.e. the physical walking
// order used by the Inventory count sheet. Reports sort by this so the two
// line up. Built fresh per report (O(n), negligible) rather than cached —
// a cache keyed on item counts would go stale on a rename and silently
// sort that item to the bottom.
function buildCatalogOrderIndex(){
  const idx = {};
  SUP_NAMES.forEach((sn, supIdx)=>{
    (state.catalog[sn]?.items||[]).forEach((it, itemIdx)=>{
      idx[sn+'|'+it.name] = {sup:supIdx, item:itemIdx};
    });
  });
  return idx;
}
function catalogOrderOf(idx, supplier, name){
  // Unknown (renamed/deleted since the record was saved) → sorts to the end,
  // but still grouped under its supplier rather than scattered.
  return idx[supplier+'|'+name]
      || {sup: SUP_NAMES.indexOf(supplier)>=0 ? SUP_NAMES.indexOf(supplier) : 999, item: 99999};
}

// Build the per-item report for a filter spec.
// Returns { rows:[{name,supplier,type,totalQty,occurrences,unitCost,totalCost}], recordCount }
function buildReport(history, filter){
  const f = {...defaultReportFilter(), ...filter};
  const supSet = f.suppliers==='all' ? null : new Set(f.suppliers);
  const search = (f.search||'').trim().toLowerCase();

  const matched = (history||[]).filter(rec=>{
    if(!inRange(rec, f.start, f.end)) return false;
    if(supSet && !supSet.has(rec.supplier)) return false;
    if(f.types!=='all' && rec.type!==f.types) return false;
    return true;
  });

  // Aggregate by supplier+name+type so an order and an inventory count
  // for the same item don't get merged into one confusing row.
  const byKey = {};
  for(const rec of matched){
    const recTs = rec.ts || Date.parse(rec.date) || 0;
    for(const it of (rec.items||[])){
      const qty = +it.orderQty||0;
      if(f.activeOnly && qty<=0 && it.count==null) continue;   // skip true zero-activity lines
      if(search && !it.name.toLowerCase().includes(search)) continue;
      const key = rec.supplier+'|'+it.name+'|'+rec.type;
      if(!byKey[key]) byKey[key] = {
        name: it.name, supplier: rec.supplier, type: rec.type,
        totalQty: 0, occurrences: 0, unitCost: it.unitCost,
        firstDate: rec.date, firstTs: recTs, lastDate: rec.date, lastTs: recTs,
        lastCount: it.count!=null ? it.count : null,
        breakageQty: 0, breakageValue: 0, breakageValueKnown: false,
      };
      const row = byKey[key];
      row.totalQty += qty;
      row.occurrences += 1;
      // "Latest" must mean chronologically latest, not whichever record we
      // happen to visit last while looping — history isn't guaranteed to be
      // in date order, so compare real timestamps rather than overwriting
      // unconditionally (that bug wouldn't show with only 1 matching record,
      // but silently picks the wrong one once a report spans 2+ saved months).
      if(recTs < row.firstTs){ row.firstTs=recTs; row.firstDate=rec.date; }
      if(recTs >= row.lastTs){
        row.lastTs=recTs; row.lastDate=rec.date;
        if(it.count!=null) row.lastCount = it.count;
      }
      if(row.unitCost==null && it.unitCost!=null) row.unitCost = it.unitCost;
      if(it.breakageQty){
        row.breakageQty += it.breakageQty;
        if(it.breakageValue!=null){ row.breakageValue += it.breakageValue; row.breakageValueKnown=true; }
      }
    }
  }
  // Sort in CATALOG order — the same sequence as the Inventory count sheet,
  // which follows the physical walking order of the restaurant. Sorting by
  // quantity instead (the old behavior) scrambled the list relative to how
  // the count was actually taken, making the two impossible to read side by
  // side. Suppliers keep their catalog order too; anything no longer in the
  // catalog (deleted/renamed item still present in history) sorts to the end
  // rather than silently vanishing.
  const _catIdx = buildCatalogOrderIndex();
  const rows = Object.values(byKey).map(r=>({
    ...r,
    totalCost: (r.unitCost!=null) ? +(r.totalQty*r.unitCost).toFixed(2) : null,
    breakageValue: r.breakageValueKnown ? +r.breakageValue.toFixed(2) : null,
  })).sort((a,b)=>{
    const sa = catalogOrderOf(_catIdx, a.supplier, a.name), sb = catalogOrderOf(_catIdx, b.supplier, b.name);
    if(sa.sup !== sb.sup) return sa.sup - sb.sup;
    if(sa.item !== sb.item) return sa.item - sb.item;
    // Same item appearing as both an order and an inventory count: keep a
    // stable, predictable pairing rather than leaving it to sort chance.
    return String(a.type).localeCompare(String(b.type));
  });

  const breakageTotal = +rows.reduce((s,r)=> s+(r.breakageValue||0), 0).toFixed(2);
  const breakageKnownCount = rows.filter(r=>r.breakageQty>0 && r.breakageValue!=null).length;
  const breakageUnpricedCount = rows.filter(r=>r.breakageQty>0 && r.breakageValue==null).length;

  return { rows, recordCount: matched.length, filter: f,
    breakageTotal, breakageKnownCount, breakageUnpricedCount };
}

// Compare current-range totals against the same range one year earlier.
function buildYoyComparison(history, filter){
  const cur = buildReport(history, filter);
  const s1 = new Date(filter.start+'T00:00:00'); s1.setFullYear(s1.getFullYear()-1);
  const e1 = new Date(filter.end+'T00:00:00');   e1.setFullYear(e1.getFullYear()-1);
  const prior = buildReport(history, {...filter, start:isoDate(s1), end:isoDate(e1)});
  const priorByKey={};
  for(const r of prior.rows) priorByKey[r.supplier+'|'+r.name+'|'+r.type]=r.totalQty;
  const rows = cur.rows.map(r=>{
    const key=r.supplier+'|'+r.name+'|'+r.type;
    const priorQty = priorByKey[key];
    return { ...r, priorQty: priorQty==null?null:priorQty,
      delta: priorQty==null?null:(r.totalQty-priorQty) };
  });
  return { rows, recordCount: cur.recordCount, priorRecordCount: prior.recordCount,
    priorRange:{start:isoDate(s1),end:isoDate(e1)}, filter };
}

// Flatten every logged price change (across all items, unaggregated — each
// entry IS a discrete event worth showing on its own) into report rows,
// filtered by date range / supplier / item-name search.
function buildPriceReport(priceHistory, catalog, filter){
  const f = {...defaultReportFilter(), ...filter};
  const supSet = f.suppliers==='all' ? null : new Set(f.suppliers);
  const search = (f.search||'').trim().toLowerCase();

  const itemInfo = {};
  for(const sn of Object.keys(catalog||{})){
    for(const it of catalog[sn].items) itemInfo[it.id] = {name:it.name, supplier:sn, itemNum:it.itemNum||''};
  }

  const rows = [];
  for(const itemId of Object.keys(priceHistory||{})){
    const info = itemInfo[itemId];
    if(!info) continue;                                  // item since deleted; skip gracefully
    if(supSet && !supSet.has(info.supplier)) continue;
    if(search && !info.name.toLowerCase().includes(search)) continue;
    for(const entry of (priceHistory[itemId]||[])){
      if(!inRange(entry, f.start, f.end)) continue;
      rows.push({
        itemId, name:info.name, supplier:info.supplier, itemNum:info.itemNum,
        date:entry.date, ts:entry.ts, price:entry.price, prevPrice:entry.prevPrice,
        delta:entry.delta, deltaPct:entry.deltaPct,
      });
    }
  }
  rows.sort((a,b)=> b.ts-a.ts);   // most recent change first
  const increasesCount = rows.filter(r=>r.delta>0).length;
  const decreasesCount = rows.filter(r=>r.delta<0).length;
  return { rows, recordCount: rows.length, filter: f, increasesCount, decreasesCount };
}

if(typeof module!=='undefined'){
  module.exports={defaultReportFilter,reportPreset,inRange,buildReport,buildYoyComparison,buildPriceReport,isoDate};
}
/* ═══════════════════════════════════════════════════════════════════
   4. RENDER  — one pipeline. render() rebuilds #app from state.
   ═══════════════════════════════════════════════════════════════════ */
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  const app = $('app');
  app.innerHTML = topBar() + supBar() + `<div class="content">${tabBody()}</div>` + tabBar();
}

// Which sub-view is showing inside the Reports hub. View-state only —
// deliberately not synced, same reasoning as _invPeriodTs: one person
// browsing Prices on the hub shouldn't yank another device's screen.
let _reportSubTab = 'reports';
const REPORT_SUBTABS = [
  ['history','🕐','History'], ['reports','📊','Reports'],
  ['cog','💰','COGS'], ['price','🏷️','Prices'],
];
function setReportSubTab(key){ _reportSubTab = key; render(); }
// Cross-navigation from Dashboard's quick actions: jump straight into a
// specific Reports sub-view, not just the hub's default.
function goToReportsSubTab(key){ _reportSubTab = key; setTab('report'); }

function topBar(){
  const s = state; const supp = s.catalog[s.activeSupp];
  const reportSubLabel = {history:'History',reports:'Reports',cog:'Cost of Goods',price:`Prices — ${s.activeSupp}`}[_reportSubTab];
  const title = s.tab==='dashboard' ? 'Dashboard'
    : s.tab==='order' ? s.activeSupp
    : s.tab==='inventory' ? 'Inventory'
    : s.tab==='report' ? reportSubLabel
    : s.tab==='help' ? 'Help' : "Bartlett's";
  const onInv = s.tab==='inventory';
  return `<div class="topbar">
    <div><h1>${esc(title)}</h1><div class="sub">${onInv ? '<span id="ckpt-last">'+esc(ckptLabel())+'</span>' : "Bartlett's — Austin, TX"}</div></div>
    <div style="display:flex;gap:8px;align-items:center">
      ${onInv ? `<button class="sync-badge synced" style="white-space:nowrap" onclick="checkpointTap()">✓ Checkpoint</button>` : ''}
      <button id="sync" class="sync-badge ${_syncStatus}" onclick="showSyncDetail()"><span class="sync-dot"></span><span>${_syncStatus}</span></button>
    </div>
  </div>`;
}

function supBar(){
  const showsSupplierPicker = state.tab==='order' || (state.tab==='report' && _reportSubTab==='price');
  if(!showsSupplierPicker) return '';
  return `<div class="supbar">${SUP_NAMES.map(sn=>{
    const c = DEFAULT_SUPPLIERS[sn];
    const on = sn===state.activeSupp;
    const style = on ? `background:${c.color};border-color:${c.accent};color:${c.accent}` : '';
    return `<button class="sup-pill${on?' active':''}" style="${style}" onclick="setSupp('${sn}')">${sn}</button>`;
  }).join('')}</div>`;
}

function tabBar(){
  const tabs = [
    ['dashboard','🏠','Dashboard'],['order','📋','Order'],['inventory','📦','Inventory'],
    ['report','📊','Reports'],['help','❔','Help']
  ];
  return `<div class="tabbar">${tabs.map(([id,ico,lbl])=>
    `<button class="tab${state.tab===id?' active':''}" onclick="setTab('${id}')">
       <span class="ico">${ico}</span>${lbl}</button>`).join('')}</div>`;
}

// Reports hub: one tab, four sub-views (History / Reports / COGS / Prices)
// switched with the same pill pattern used everywhere else in the app,
// instead of four separate top-level tabs for things that are all
// fundamentally "look back and analyze" rather than "do the work now".
function reportsHubView(){
  const subNav = `<div class="supbar" style="padding:10px 0 4px">${REPORT_SUBTABS.map(([key,ico,lbl])=>{
    const on = _reportSubTab===key;
    return `<button class="sup-pill${on?' active':''}" style="${on?'background:var(--accent);color:#04121f':''}"
      onclick="setReportSubTab('${key}')">${ico} ${lbl}</button>`;
  }).join('')}</div>`;
  const body = _reportSubTab==='history' ? historyView()
    : _reportSubTab==='cog' ? cogView()
    : _reportSubTab==='price' ? priceView()
    : reportView();
  return subNav + body;
}

function tabBody(){
  switch(state.tab){
    case 'dashboard': return dashboardView();
    case 'order':     return orderView();
    case 'inventory': return inventoryView();
    case 'report':    return reportsHubView();
    case 'help':      return helpView();
    default:          return '';
  }
}

/* ── ORDER VIEW ── */
function orderView(){
  const sn = state.activeSupp;
  const supp = state.catalog[sn];
  const items = supp.items;
  const orderCount = items.reduce((n,i)=> n + ((+state.orderQty[i.id]||0)>0?1:0), 0);
  const skippedCount = items.reduce((n,i)=> n + (state.skipped[i.id]?1:0), 0);
  const edit = state.editMode;

  const rows = items.map(it=>{
    const qty = +state.orderQty[it.id]||0;
    const oh  = state.onHand[it.id];
    const st  = stockStatus(oh, it.par);
    const skipped = !edit && !!state.skipped[it.id];
    const cls = (skipped?' skipped':'') + (st==='crit'?' crit':st==='low'?' low':'');
    const stamp = st==='crit' ? '<span class="stamp crit">Out</span>'
      : st==='low' ? '<span class="stamp low">Low</span>' : '';
    const meta = [
      it.itemNum?`<span class="num">#${esc(it.itemNum)}</span>`:'',
      it.pack?esc(it.pack):'',
      it.par!=null?`par ${it.par}`:'',
      (edit && it.unitCost!=null)?`$${it.unitCost}`:''
    ].filter(Boolean).join(' · ');

    const right = edit
      ? `<button class="par-tag" style="padding:8px 12px" onclick="editItem('${sn}','${it.id}')">✎ Edit</button>`
      : skipped
        ? `<button class="skip-pill" onclick="toggleSkip('${it.id}')">✓ Skipped — tap to recheck</button>`
        : `<button class="skip-toggle" onclick="toggleSkip('${it.id}')" title="Checked, no order needed">✓</button>
          <div class="stepper">
          <button onclick="bumpQty('${it.id}',-1)">−</button>
          <input class="qty${qty>0?' has':''}" inputmode="numeric" value="${qty||''}"
            placeholder="0" onchange="setQty('${it.id}',this.value)">
          <button onclick="bumpQty('${it.id}',1)">+</button>
        </div>`;

    return `<div class="item${cls}">
      <div class="item-main">
        <div class="item-name">${esc(it.name)} ${stamp}</div>
        <div class="item-meta">${meta}</div>
      </div>
      ${right}
    </div>`;
  }).join('');

  const sendLabel = sn==='ABCO'?'📱 Text order to Hal'
    : sn==='BEK'?'📄 Download BEK CSV'
    : sn==='TRIMARK'?'✉️ Email James'
    : '✉️ Email order';

  const editBar = `<div class="btn-row">
    <button class="btn ghost" onclick="toggleEdit()" style="${edit?'background:var(--accent);color:#04121f':''}">
      ${edit?'✓ Done editing':'✎ Edit items'}</button>
    ${edit?`<button class="btn ghost" onclick="addItem('${sn}')">＋ Add item</button>`:''}
  </div>`;

  if(edit){
    return `<div class="sched"><b>Edit mode:</b> tap any item to change its name, pack,
      par, price, or number — or delete it. Add new items with ＋.</div>
      ${editBar}${items.length?rows:'<div class="empty">No items.</div>'}${editBar}`;
  }

  return `
    <div class="sched"><b>Schedule:</b> ${esc(supp.schedule||'—')}<br>
      <b>Contact:</b> ${esc(supp.contact||'—')}</div>
    ${items.length?rows:'<div class="empty">No items.</div>'}
    <div class="btn-row">
      <button class="btn" onclick="sendOrder('${sn}')">${sendLabel} <span class="pill-count">${orderCount}</span></button>
    </div>
    <button class="btn ghost" onclick="saveOrder('${sn}')">💾 Log order without sending</button>
    <button class="btn ghost" onclick="clearOrder('${sn}')">Clear order${skippedCount>0?' &amp; '+skippedCount+' skipped':''}</button>
    ${editBar}`;
}

/* ── INVENTORY VIEW (TRIMARK monthly count) ── */
/* ── Which inventory period is on screen. null = current (live) period;
   otherwise the ts of a saved TRIMARK inventory record. View-state only —
   deliberately NOT synced, so one person browsing last month doesn't yank
   another device off the count they're taking right now. ── */
let _invPeriodTs = null;

function inventoryPeriods(){
  const saved = state.history
    .map((h,idx)=>({h,idx}))
    .filter(({h})=> h.supplier==='TRIMARK' && h.type==='inventory')
    .map(({h,idx})=>({ ts:h.ts, label:h.date, idx }))
    .sort((a,b)=> b.ts-a.ts);
  return [{ts:null, label:'Current', idx:null}, ...saved];
}

function setInvPeriod(ts){
  _invPeriodTs = (ts==='null'||ts===null||ts==='') ? null : +ts;
  state.editMode = false;   // never carry catalog-edit mode into a past period
  render();
}

function inventoryPeriodBar(){
  const periods = inventoryPeriods();
  if(periods.length<=1) return '';   // nothing saved yet — no picker needed
  return `<div class="supbar" style="padding:6px 0">${periods.map(p=>{
    const on = (p.ts===null && _invPeriodTs===null) || (p.ts!==null && p.ts===_invPeriodTs);
    return `<button class="sup-pill${on?' active':''}"
      style="${on?'background:var(--accent);color:#04121f':''}"
      onclick="setInvPeriod(${p.ts===null?'null':p.ts})">${esc(p.label)}</button>`;
  }).join('')}</div>`;
}

// Which Inventory mode is showing: 'count' (new, area-first fast entry,
// matching how counting actually happens — walk to one spot, count
// everything there) or 'review' (the full item list, for checking
// everything and placing orders once counting is done). View-state only,
// not synced — same reasoning as the other view-state variables here.
let _invMode = 'count';
let _invArea = null;
function setInvMode(m){ _invMode = m; render(); }
function setInvArea(a){ _invArea = a; render(); }

function inventoryView(){
  const items = state.catalog['TRIMARK'].items;
  const edit = state.editMode;

  // Viewing a saved month rather than the live count.
  if(_invPeriodTs!=null){
    const rec = state.history.find(h=>h.ts===_invPeriodTs && h.type==='inventory');
    if(!rec){ _invPeriodTs = null; }          // record deleted while open
    else return historicalInventoryView(rec);
  }

  const editBar = `<div class="btn-row">
    <button class="btn ghost" onclick="toggleEdit()" style="${edit?'background:var(--accent);color:#04121f':''}">
      ${edit?'✓ Done editing':'✎ Edit items'}</button>
    ${edit?`<button class="btn ghost" onclick="addItem('TRIMARK')">＋ Add item</button>`:''}
  </div>`;

  if(edit){
    const erows = items.map(it=>{
      const meta=[it.pack?esc(it.pack):'', it.par!=null?`par ${it.par}`:'',
        it.unitCost!=null?`$${it.unitCost}`:'',
        it.orderChannel?`↳ ${it.orderChannel}`:''].filter(Boolean).join(' · ');
      return `<div class="item"><div class="item-main">
        <div class="item-name">${esc(it.name)}</div><div class="item-meta">${meta}</div></div>
        <button class="par-tag" style="padding:8px 12px" onclick="editItem('TRIMARK','${it.id}')">✎ Edit</button>
      </div>`;
    }).join('');
    return `<div class="sched"><b>Edit mode:</b> tap any item to change name, pack, par,
      or price — or delete it.</div>${editBar}${erows}${editBar}`;
  }

  const modeBar = `<div class="btn-row">
    <button class="btn${_invMode==='count'?'':' ghost'}" onclick="setInvMode('count')">📍 Count</button>
    <button class="btn${_invMode==='review'?'':' ghost'}" onclick="setInvMode('review')">📋 Review &amp; order</button>
  </div>`;

  return `${inventoryPeriodBar()}${modeBar}
    ${_invMode==='review' ? inventoryReviewView(items, editBar) : areaCountView(items)}`;
}

/* ── COUNT mode: area-first, matching how the count actually happens —
   walk to one physical spot, go down one list, count everything there,
   move to the next spot. Every item is shown for every area (any item
   could theoretically live anywhere), so a "not here" item just stays
   blank — exactly like skipping past it on a paper checklist. ── */
function areaCountView(items){
  const locs = getLocations();
  if(!_invArea || !locs.includes(_invArea)) _invArea = locs[0];

  const areaPills = `<div class="supbar" style="padding:10px 0 4px">
    ${locs.map(loc=>{
      const on = loc===_invArea;
      return `<button class="sup-pill${on?' active':''}" style="${on?'background:var(--accent);color:#04121f':''}"
        onclick="setInvArea('${escJs(loc)}')">${esc(loc)}</button>`;
    }).join('')}
    <button class="sup-pill" onclick="editLocations()">⚙</button>
  </div>`;

  const touched = items.filter(it=>{
    const t = state.trimark[it.id]||{};
    return areaSubtotal(t.areas && t.areas[_invArea]) != null;
  }).length;

  const rows = items.map((it,idx)=>{
    const t = state.trimark[it.id]||{};
    const arr = (t.areas && t.areas[_invArea]) || null;
    const sum = areaSubtotal(arr);
    const savedHint = arr && arr.length ? (arr.length>1 ? `${arr.join('+')} = ${sum}` : `${sum}`) : null;
    const otherAreas = locs.filter(l=>l!==_invArea).map(l=>{
      const v = areaSubtotal(t.areas && t.areas[l]);
      return v!=null ? `${esc(l)}: ${v}` : null;
    }).filter(Boolean).join(' · ');
    return `<div class="item">
      <div class="item-main">
        <div class="item-name">${esc(it.name)}</div>
        ${savedHint ? `<div class="item-meta" style="color:var(--ok)">Already have: ${esc(savedHint)}</div>` : ''}
        ${otherAreas ? `<div class="item-meta" style="color:var(--purple)">${otherAreas}</div>` : ''}
      </div>
      <input class="field" style="width:64px;text-align:center;margin:0" inputmode="numeric"
        id="area-input-${idx}" value="" placeholder="0"
        onkeydown="if(event.key==='Enter'){event.preventDefault();commitAreaEntry('${it.id}','${escJs(_invArea)}',${idx},${idx+1});}">
      <button class="skip-toggle" style="margin-left:6px" onclick="addAreaEntryInline('${it.id}','${escJs(_invArea)}',${idx})">＋</button>
    </div>`;
  }).join('');

  return `<div class="sched"><b>${touched}/${items.length}</b> counted in <b>${esc(_invArea)}</b> so far.
    Type a count and hit Enter (or Go/Done on the keypad) to jump straight to the next item.
    Found the same item in another spot here too? Tap ＋ to log it and add another —
    the field clears and stays ready for the next one. Other areas already logged for
    an item show as a hint below its name.</div>
    ${areaPills}
    ${rows}`;
}

// Update one item's count for one area, keep the item's total/back-compat
// mirror in sync, and — when advancing from Enter — refocus the next
// input AFTER the new DOM exists (render() replaces the whole list, so
// grabbing the next field has to happen on the far side of that, not
// before it, or it'd be focusing an element that's about to be thrown away).
// Tap ＋: log whatever's typed as one more entry for this item, then clear
// the field and refocus it — ready for another spot of the same item,
// without ever pre-filling (so it can't accidentally resubmit an old value).
function addAreaEntryInline(itemId, area, idx){
  const el = $('area-input-'+idx);
  pushAreaEntry(itemId, area, el ? el.value : '');
  render();
  const again = $('area-input-'+idx);
  if(again){ again.value=''; if(again.focus) again.focus(); }
}

// Enter / Go / Done: log whatever's typed (if anything) as this item's
// final entry for this pass, then move to the next item. An empty field
// just means "nothing more here" and advances without changing anything.
function commitAreaEntry(itemId, area, idx, focusNextIdx){
  const el = $('area-input-'+idx);
  const raw = el ? el.value : '';
  if(raw.trim()!=='' && isNaN(+raw)) return;   // don't advance past garbage input
  pushAreaEntry(itemId, area, raw);
  render();
  if(focusNextIdx!=null){
    const next = $('area-input-'+focusNextIdx);
    if(next && next.focus) next.focus();
  }
}

/* ── REVIEW mode: the full item list — Begin/Add/Count/Order, breakage,
   and the order-and-save actions. Unchanged from before; this is where
   you check everything once counting is done, and finalize the month. ── */
function inventoryReviewView(items, editBar){
  const counted = items.filter(i=>{
    const t=state.trimark[i.id]||{}; return t.count!=null && t.count!=='';
  }).length;
  const head = `<div class="inv-head">
    <div>Item</div><div>Begin</div><div>Add</div><div>Count</div><div>Order</div></div>`;

  const rows = items.map(it=>{
    const t = state.trimark[it.id]||{};
    const r = trimarkRow(t.begin, t.add, t.count, it.par, it.unitCost);
    const done = r.counted!=null;
    const cbtn = done
      ? `<button class="${r.counted===0?'zero':'done'}" onclick="openCount('${it.id}')">${r.counted}</button>`
      : `<button onclick="openCount('${it.id}')">—</button>`;
    const chTag = it.orderChannel ? `<span style="font-size:10px;color:var(--purple)">↳${it.orderChannel}</span>` : '';
    const breakTag = (r.breakageValue!=null && r.breakageValue>0)
      ? `<span style="font-size:10px;color:var(--crit);font-weight:700">⚠ $${r.breakageValue.toFixed(2)} breakage</span>`
      : (r.breakageQty!=null && r.breakageQty>0 && it.unitCost==null)
        ? `<span style="font-size:10px;color:var(--dim)">${r.breakageQty} short · set price to value it</span>`
        : '';
    const orderDisplay = r.order!=null
      ? (it.caseQty && it.caseQty>1 ? unitsToCases(r.order, it.caseQty) : r.order)
      : '—';
    return `<div class="inv-row${done?' counted':''}">
      <div class="nm">${esc(it.name)} ${chTag}${breakTag?'<br>'+breakTag:''}</div>
      <div class="inv-cell begin">${t.begin!=null&&t.begin!==''?t.begin:'—'}</div>
      <div class="inv-cell add">${t.add?('+'+t.add):'—'}</div>
      <div class="inv-cell">${cbtn}</div>
      <div class="inv-cell">${orderDisplay}</div>
    </div>`;
  }).join('');

  // Running breakage total across all counted items this period.
  const breakTotals = items.reduce((acc,it)=>{
    const t = state.trimark[it.id]||{};
    const r = trimarkRow(t.begin, t.add, t.count, it.par, it.unitCost);
    if(r.breakageValue!=null) acc.value += r.breakageValue;
    if(r.breakageQty) acc.itemsWithBreakage += (r.breakageQty>0 ? 1 : 0);
    if(r.breakageQty>0 && it.unitCost==null) acc.unpriced += 1;
    return acc;
  }, {value:0, itemsWithBreakage:0, unpriced:0});

  // Order buttons: one per channel (James / firewood text / BEK oil / uniform email)
  const chans = trimarkChannelSummary();
  const chanBtns = chans.length
    ? chans.map(c=>{
        if(c.manual){
          return `<button class="btn ghost" onclick="sendTrimarkChannel('${c.key}')">
            🔥 ${esc(c.label)}</button>`;
        }
        const primary = c.key==='james';
        return `<button class="btn${primary?'':' ghost'}" onclick="sendTrimarkChannel('${c.key}')">
          ${esc(c.label)} <span class="pill-count">${c.n}</span></button>`;
      }).join('')
    : '<div class="sched">No items above par — nothing to order yet.</div>';

  return `<div class="sched"><b>${counted}/${items.length} counted</b> ·
      START = Begin + Add · USED = Start − Count · ORDER = Par − Count</div>
    ${breakTotals.value>0 || breakTotals.unpriced>0 ? `<div class="hist-card" style="border-color:var(--crit)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;color:var(--crit)">⚠ Breakage this count</span>
        <span style="font-size:22px;font-weight:800;color:var(--crit)">$${breakTotals.value.toFixed(2)}</span>
      </div>
      <div class="sched" style="padding:4px 0 0">${breakTotals.itemsWithBreakage} item${breakTotals.itemsWithBreakage!==1?'s':''} short vs. start count
        ${breakTotals.unpriced?` · ${breakTotals.unpriced} more short but unpriced (set a price to value them)`:''}</div>
    </div>` : ''}
    ${head}${rows}
    <div class="sched" style="margin-top:14px"><b>Orders route by item:</b>
      most go to James · firewood texts · fryer oil joins the BEK CSV ·
      hats &amp; aprons email the uniform vendor.</div>
    ${chanBtns}
    <button class="btn ghost" onclick="saveInventory()" style="margin-top:12px">💾 Save month &amp; reset</button>
    ${editBar}`;
}

/* ── Viewing (and correcting) a saved month ──
   Reads from the frozen history record rather than the live period. Counts
   stay editable because errors surface after a month is closed — but every
   edit recalculates used/order/breakage from begin+add+count so the record
   can never drift into an inconsistent state. ── */
function historicalInventoryView(rec){
  const recIdx = state.history.indexOf(rec);
  const items = rec.items||[];
  const counted = items.filter(i=>i.count!=null).length;

  const head = `<div class="inv-head">
    <div>Item</div><div>Begin</div><div>Add</div><div>Count</div><div>Broke</div></div>`;

  const rows = items.map(it=>{
    const done = it.count!=null;
    const cbtn = done
      ? `<button class="${it.count===0?'zero':'done'}" onclick="openHistoricalCount(${rec.ts},'${esc(it.id)}')">${it.count}</button>`
      : `<button onclick="openHistoricalCount(${rec.ts},'${esc(it.id)}')">—</button>`;
    const breakCell = it.breakageQty>0
      ? `<span style="color:var(--crit);font-weight:700">${it.breakageQty}</span>`
      : '—';
    const breakTag = (it.breakageValue!=null && it.breakageValue>0)
      ? `<span style="font-size:10px;color:var(--crit);font-weight:700">⚠ $${it.breakageValue.toFixed(2)}</span>`
      : '';
    return `<div class="inv-row${done?' counted':''}">
      <div class="nm">${esc(it.name)}${breakTag?'<br>'+breakTag:''}</div>
      <div class="inv-cell begin">${it.begin!=null&&it.begin!==''?it.begin:'—'}</div>
      <div class="inv-cell add">${it.add?('+'+it.add):'—'}</div>
      <div class="inv-cell">${cbtn}</div>
      <div class="inv-cell">${breakCell}</div>
    </div>`;
  }).join('');

  const breakTotal = items.reduce((s,i)=> s+(i.breakageValue||0), 0);
  const isLatest = state.history
    .filter(h=>h.type==='inventory' && h.supplier==='TRIMARK')
    .every(h=> h.ts<=rec.ts);

  return `${inventoryPeriodBar()}
    <div class="hist-card" style="border-color:var(--purple)">
      <div style="font-weight:700;color:var(--purple)">📅 ${esc(rec.date)} — saved month</div>
      <div class="sched" style="padding:4px 0 0">${counted} of ${items.length} items counted.
      Tap any count to correct it — used, order and breakage recalculate automatically.
      ${isLatest?'':'<br><b>Note:</b> a newer month exists, so corrections here won\'t change the current Begin.'}</div>
    </div>
    ${breakTotal>0 ? `<div class="hist-card" style="border-color:var(--crit)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;color:var(--crit)">⚠ Breakage this month</span>
        <span style="font-size:22px;font-weight:800;color:var(--crit)">$${breakTotal.toFixed(2)}</span>
      </div></div>` : ''}
    ${head}${rows}
    <div class="sched" style="margin-top:14px">This is a closed month — the current period handles
      new ordering. You can still re-send this month's order if it never went out or got lost.</div>
    <button class="btn" onclick="resendInventoryOrder(${recIdx})">↻ Re-send this month's order</button>
    <button class="btn ghost" onclick="setInvPeriod(null)" style="margin-top:8px">← Back to current month</button>
    <button class="btn ghost" onclick="deleteRecord(${recIdx})" style="color:var(--crit)">🗑 Delete this month's record</button>`;
}

function openHistoricalCount(ts, itemId){
  const rec = state.history.find(h=>h.ts===ts && h.type==='inventory');
  if(!rec) return;
  const it = (rec.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  modal(`<h2>${esc(it.name)}</h2>
    <div class="sched">${esc(rec.date)} · correcting a saved month</div>
    <label class="fl">Begin (carried in from the prior month)</label>
    <input class="field" id="hc-begin" inputmode="decimal" value="${it.begin!=null?esc(it.begin):''}" placeholder="0">
    <label class="fl">Deliveries received (Add)</label>
    <input class="field" id="hc-add" inputmode="decimal" value="${it.add!=null&&it.add!==''?esc(it.add):''}" placeholder="0">
    <label class="fl">Final count</label>
    <input class="field" id="hc-count" inputmode="decimal" value="${it.count!=null?esc(it.count):''}" placeholder="0">
    <div class="sched">Used and breakage are recalculated from these three numbers.</div>
    <button class="btn" onclick="saveHistoricalCount(${ts},'${esc(itemId)}')">Save correction</button>`);
}

function saveHistoricalCount(ts, itemId){
  const rec = state.history.find(h=>h.ts===ts && h.type==='inventory');
  if(!rec) return;
  const it = (rec.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  const bRaw=$('hc-begin').value, aRaw=$('hc-add').value, cRaw=$('hc-count').value;
  const begin = bRaw===''?0:+bRaw, add = aRaw===''?0:+aRaw;
  const count = cRaw===''?null:+cRaw;
  if(isNaN(begin)||isNaN(add)||(count!=null&&isNaN(count))){ toast('Enter valid numbers','warn'); return; }

  // Recompute every derived field from the corrected inputs — the whole
  // point is that a corrected record stays internally consistent.
  const cat = state.catalog['TRIMARK'].items.find(i=>i.id===itemId);
  const r = trimarkRow(begin, add, count, cat?cat.par:it.par, it.unitCost);
  it.begin = begin; it.add = add; it.count = r.counted;
  it.used = r.used; it.orderQty = r.order||0;
  it.breakageQty = r.breakageQty; it.breakageValue = r.breakageValue;

  persist('history');

  // If this is the newest saved month, its count is what rolled into the
  // current period's Begin — offer to bring that forward too, rather than
  // silently leaving the two disagreeing.
  const isLatest = state.history
    .filter(h=>h.type==='inventory' && h.supplier==='TRIMARK')
    .every(h=> h.ts<=rec.ts);
  const cur = state.trimark[itemId];
  const curBegin = cur ? +cur.begin||0 : null;
  if(isLatest && r.counted!=null && curBegin!==r.counted){
    closeModal();
    confirmModal(`Corrected to ${r.counted}.\n\nThis month's Begin for ${it.name} is currently ${curBegin==null?'unset':curBegin}. Update it to ${r.counted} to match?`, ()=>{
      state.trimark[itemId] = {...(state.trimark[itemId]||{}), begin:r.counted};
      persist('trimark'); render(); toast('Correction saved · current Begin updated','ok');
    }, 'Update Begin');
    return;
  }
  closeModal(); render(); toast('Correction saved','ok');
}
